<!doctype html>
<html lang="en" data-resolution="landscape" data-format="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Which One Wins</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ground: #ffffff; --ink: #111418; --blue: #1e7fd8; --sky: #dff2fc; --muted: #8b96a3; --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: "Hand", sans-serif; color: var(--ink); overflow: hidden; }
      #stage { position: absolute; width: 1080px; height: 1080px; left: 0; top: 300px; transform-origin: 0 0; overflow: hidden; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1420px; height: 260px; }
      #tag { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; }
      html[data-format="landscape"] { --W: 1920px; --H: 1080px; }
      html[data-format="landscape"] #stage { left: 70px; top: 43px; }
      html[data-format="landscape"] #caps { left: 1120px; width: 740px; top: 360px; height: 420px; }
      html[data-format="landscape"] #tag { left: 1120px; width: 740px; top: 150px; }
      html[data-format="landscape"] .cap { font-size: 84px; }
      html[data-format="landscape"] .pill { font-size: 28px; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; }
      .abs { position: absolute; }
      svg { overflow: visible; }
      .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; padding: 10px 28px; border: 5px solid var(--ink); border-radius: 999px; font-family: "Cap"; font-weight: 900; font-size: 34px; letter-spacing: 0.04em; background: #fff; }
      .pill b { color: var(--blue); }
      .label { font-family: "Hand"; font-size: 66px; line-height: 1; text-align: center; }
      .small { font-family: "Hand"; font-size: 48px; line-height: 1; text-align: center; }
      .chip { font-family: "Cap"; font-weight: 900; font-size: 52px; letter-spacing: 0.06em; padding: 8px 30px; border-radius: 18px; background: var(--blue); color: #fff; border: 5px solid var(--ink); }
      .card { background: #fff; border: 8px solid var(--ink); border-radius: 28px; text-align: center; }
      .cap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Cap"; font-weight: 900; font-size: 76px; line-height: 1.12; color: var(--ink); opacity: 0; }
      .cap span { display: inline-block; margin: 0 0.06em; }
      .cap span.k { color: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="57.5" data-width="1920" data-height="1080">
      <audio id="vo" class="clip" src="assets/voice.wav" data-start="0" data-duration="57.5" data-track-index="9"></audio>
      <div id="tag" class="clip" data-start="0" data-duration="54.3" data-track-index="8">
        <div class="pill">EP. 4 · <b>WATER:</b> WHAT WE DON'T SEE</div>
      </div>
      <div id="stage">
        <div id="s0" class="scene clip" data-start="0" data-duration="5.0" data-track-index="1"><div class="cam"></div></div>
        <div id="s1" class="scene clip" data-start="5.0" data-duration="5.5" data-track-index="1"><div class="cam"></div></div>
        <div id="s2" class="scene clip" data-start="10.5" data-duration="5.0" data-track-index="1"><div class="cam"></div></div>
        <div id="s3" class="scene clip" data-start="15.5" data-duration="6.3" data-track-index="1"><div class="cam"></div></div>
        <div id="s4" class="scene clip" data-start="21.8" data-duration="6.2" data-track-index="1"><div class="cam"></div></div>
        <div id="s5" class="scene clip" data-start="28.0" data-duration="10.5" data-track-index="1"><div class="cam"></div></div>
        <div id="s6" class="scene clip" data-start="38.5" data-duration="4.4" data-track-index="1"><div class="cam"></div></div>
        <div id="s7" class="scene clip" data-start="42.9" data-duration="5.1" data-track-index="1"><div class="cam"></div></div>
        <div id="s8" class="scene clip" data-start="48.0" data-duration="6.3" data-track-index="1"><div class="cam"></div></div>
        <div id="s9" class="scene clip" data-start="54.3" data-duration="3.2" data-track-index="1"><div class="cam"></div></div>
      </div>
      <div id="caps"></div>
    </div>

    <script>
      /* ================= helpers ================= */
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", MUTED = "#8b96a3", DIRT = "#8a7660", GRAY = "#4a4f57";
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const cam = (id) => document.getElementById(id).getElementsByClassName("cam")[0];
      const add = (id, html) => cam(id).insertAdjacentHTML("beforeend", html);
      const addTop = (id, html) => document.getElementById(id).insertAdjacentHTML("beforeend", html);
      const focus = (px, py, s) => ({ x: 540 - px * s, y: 540 - py * s, scale: s });

      /* voice lines: [start, duration, text]; word times are estimated from these */
      const LINES = [
        [0.3, 4.20, "Boiling, filters, chlorine, tablets. Which one really makes water safe?"],
        [5.0, 5.03, "Boiling kills germs, but it needs fuel and time, and it's hard to do for a whole village."],
        [10.5, 4.57, "Filters trap dirt, but many let viruses through, and they need constant cleaning."],
        [15.5, 5.78, "Chlorine tablets are cheap. But in cloudy water, the chlorine gets used up, and germs can survive."],
        [21.8, 5.72, "AquaCore uses chlorine dioxide. One tablet treats twenty-five litres, in thirty minutes."],
        [28.0, 10.01, "In tests by national health laboratories in Cameroon and Niger, it eliminated E. coli, Salmonella and cholera bacteria, even in river and lake water."],
        [38.5, 3.90, "No fuel, no equipment, and about fifty cents per person, per month."],
        [42.9, 2.73, "Side by side, only one ticks every box."],
        [48.0, 5.99, "For chemicals like arsenic, test your water first. Next episode: how is water actually tested?"],
      ];
      const TIMED = LINES.map(([start, dur, text]) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        let t = start + 0.1; const span = dur - 0.25;
        return words.map((w, i) => { const d = (wts[i] / total) * span; const o = { w, t, d }; t += d; return o; });
      });
      // time the voice says `word` (nth match) in line li
      const W = (li, word, nth = 0) => {
        const m = TIMED[li].filter((x) => x.w.toLowerCase().replace(/[^\w']/g, "") === word.toLowerCase());
        return (m[nth] || m[0]).t;
      };

      function figure(id, { left, top, w, prop = "", face = "smile", cane = false }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : prop === "lens"
            ? `<g class="prop"><line x1="144" y1="210" x2="160" y2="186" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><circle cx="176" cy="160" r="30" fill="${SKY}" fill-opacity="0.7" stroke="${INK}" stroke-width="8"/></g>`
            : cane
            ? `<g class="prop"><path d="M144 210 L150 340 M144 210 q-6 -16 8 -18" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
            <g class="f-sick" opacity="${show("sick")}"><path d="M76 70 L92 80 M92 70 L76 80 M108 70 L124 80 M124 70 L108 80" stroke-width="6"/><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry", "sick"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
        if (face === "sick") tl.set(`#${id} .eyes`, { opacity: 0 }, t); else tl.set(`#${id} .eyes`, { opacity: 1 }, t);
      }
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }
      // germs
      const bacterium = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><rect x="-26" y="-13" width="52" height="26" rx="13" fill="#fff" stroke="${INK}" stroke-width="4.5"/><circle cx="-8" cy="-2" r="3" fill="${INK}"/><circle cx="8" cy="3" r="3" fill="${BLUE}"/><path d="M26 0 q7 -7 14 0 t12 0 M-26 0 q-7 7 -14 0 t-12 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>`;
      const virus = (x, y, s, cls = "") => {
        let sp = "";
        for (let a = 0; a < 360; a += 45) { const r = (a * Math.PI) / 180; sp += `<line x1="${Math.cos(r) * 18}" y1="${Math.sin(r) * 18}" x2="${Math.cos(r) * 28}" y2="${Math.sin(r) * 28}"/><circle cx="${Math.cos(r) * 30}" cy="${Math.sin(r) * 30}" r="4" fill="${BLUE}"/>`; }
        return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig" stroke="${INK}" stroke-width="4">${sp}<circle r="18" fill="#fff"/><circle cx="-5" cy="-3" r="3" fill="${INK}" stroke="none"/><circle cx="6" cy="-3" r="3" fill="${INK}" stroke="none"/></g></g>`;
      };
      const parasite = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="40" cy="-2" r="3" fill="${INK}"/></g></g>`;
      const dropPath = (x, y, s, fill, cls, stroke = INK) =>
        `<g transform="translate(${x} ${y})"><path class="${cls}" transform="scale(${s})" d="M0 -18 C-5 -8 -11 -2 -11 5 a11 11 0 0 0 22 0 C11 -2 5 -8 0 -18 Z" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/></g>`;

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, extra = {}) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", ...extra }, t);
      const wiggle = (sel, t, dur) => tl.fromTo(sel, { rotation: -12 }, { rotation: 12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 0.25)), svgOrigin: "0 0" }, t);
      const shake = (sel, t, n = 5, a = 1) => tl.fromTo(sel, { rotation: 0 }, { rotation: a, duration: 0.05, yoyo: true, repeat: n, ease: "none" }, t);

      const iPot = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><path d="M20 70 L140 70 L130 140 L30 140 Z"/><path d="M8 70 L152 70"/><path d="M50 50 q-8 -14 0 -28 M80 50 q-8 -14 0 -28 M110 50 q-8 -14 0 -28" stroke="${MUTED}" fill="none"/></g>`;
      const iFilter = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M20 30 L140 30 L100 90 L100 140 L60 140 L60 90 Z"/><path d="M36 54 L124 54" stroke="${BLUE}"/></g>`;
      const iChlor = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><rect x="50" y="60" width="60" height="84" rx="10" fill="${SKY}"/><path d="M64 60 L64 40 L96 40 L96 60"/><path d="M70 40 L70 20 L90 20 L90 40"/></g><path d="M130 90 C126 100 120 106 120 112 a10 10 0 0 0 20 0 C140 106 134 100 130 90 Z" fill="${BLUE}" stroke="${INK}" stroke-width="5"/>`;
      const iTabs = `<g stroke="${INK}" stroke-width="8" fill="#fff"><circle cx="60" cy="80" r="36"/><line x1="36" y1="80" x2="84" y2="80"/><circle cx="110" cy="104" r="30"/><line x1="90" y1="104" x2="130" y2="104"/></g>`;
      const iAqua = `<g stroke="${INK}" stroke-width="9" fill="none" stroke-linejoin="round"><path d="M80 14 C80 14 38 66 38 96 a42 42 0 0 0 84 0 C122 66 80 14 80 14 Z"/></g><circle cx="80" cy="96" r="18" fill="${BLUE}"/>`;
      const mIcon = (id, left, top, icon, word) => `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:250px;text-align:center"><svg viewBox="0 0 160 160" width="190" height="190">${icon}</svg><div class="small">${word}</div></div>`;
      const tile = (t, x, y, cls) => `<g class="${cls}" transform="translate(${x} ${y})"><g class="ti"><rect x="-38" y="-30" width="76" height="60" rx="8" fill="#fff" stroke="${INK}" stroke-width="5"/><text x="0" y="12" text-anchor="middle" font-family="Cap" font-weight="900" font-size="32" fill="${INK}">${t}</text></g></g>`;
      const cross = `<g stroke="${BLUE}" stroke-width="14" stroke-linecap="round"><line x1="20" y1="20" x2="140" y2="140"/><line x1="140" y1="20" x2="20" y2="140"/></g>`;
      const iFlame = `<path d="M80 150 C40 130 40 90 70 60 C70 90 90 95 95 75 C125 100 130 135 80 150 Z" fill="#ffd34d" stroke="${INK}" stroke-width="8"/>`;
      const iGear = `<g stroke="${INK}" stroke-width="8" fill="#fff"><circle cx="80" cy="80" r="40"/><circle cx="80" cy="80" r="14"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const r = (a * Math.PI) / 180; return `<line x1="${80 + Math.cos(r) * 40}" y1="${80 + Math.sin(r) * 40}" x2="${80 + Math.cos(r) * 58}" y2="${80 + Math.sin(r) * 58}" stroke-linecap="round" stroke-width="14"/>`; }).join("")}</g>`;
      const iClock = `<circle cx="80" cy="80" r="64" fill="#fff" stroke="${INK}" stroke-width="9"/><circle cx="80" cy="80" r="7" fill="${INK}"/>`;
      const house = (x) => `<g class="hs" transform="translate(${x} 0)"><path d="M0 60 L50 20 L100 60 L100 130 L0 130 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><rect x="38" y="88" width="24" height="42" fill="${SKY}" stroke="${INK}" stroke-width="5"/></g>`;
      const T = [0, 5.0, 10.5, 15.5, 21.8, 28.0, 38.5, 42.9, 48.0, 54.3, 57.5];

      /* ================= S0 · hook ================= */
      add("s0", figure("f0", { left: 420, top: 330, w: 240, prop: "glass", face: "hmm" }));
      add("s0", mIcon("m1", 40, 60, iPot, "boiling") + mIcon("m2", 790, 60, iFilter, "filters") + mIcon("m3", 40, 640, iChlor, "chlorine") + mIcon("m4", 790, 640, iTabs, "tablets"));
      add("s0", `<div id="q0" class="abs label" style="left:640px;top:240px;font-size:170px;color:${BLUE}">?</div>`);
      tl.fromTo("#s0 .cam", focus(540, 540, 1.15), { ...focus(540, 540, 1.0), duration: 2.5, ease: "power1.out" }, 0);
      pop("#f0", 0.1);
      [["#m1", "boiling"], ["#m2", "filters"], ["#m3", "chlorine"], ["#m4", "tablets"]].forEach(([m, w]) => pop(m, W(0, w) - 0.15));
      pop("#q0", W(0, "safe") - 0.3, { rotation: 10 });
      setFace(tl, "f0", "o", W(0, "safe"));

      /* ================= S1 · boiling ================= */
      let bubs = "";
      for (let i = 0; i < 10; i++) bubs += `<circle class="bub" cx="${110 + rnd() * 180}" cy="270" r="${6 + rnd() * 8}" fill="#fff" stroke="${BLUE}" stroke-width="4"/>`;
      add("s1", `<svg class="abs" style="left:240px;top:60px" width="600" height="600" viewBox="0 0 400 400">
        <path d="M66 112 L334 112 L314 296 L86 296 Z" fill="${SKY}"/>
        <path d="M66 132 Q133 120 200 132 T334 132" stroke="${BLUE}" stroke-width="6" fill="none"/>
        <g id="bgerms">${bacterium(140, 195, 1.0, "")}${virus(260, 180, 0.9, "")}${parasite(205, 255, 0.9, "")}</g>
        ${bubs}
        <path d="M60 100 L340 100 L316 300 L84 300 Z" fill="none" stroke="${INK}" stroke-width="10" stroke-linejoin="round"/>
        <path d="M40 100 L360 100" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>
        <g id="flame"><path d="M200 384 C166 364 168 334 190 312 C190 334 205 338 210 322 C232 342 236 368 200 384 Z" fill="#ffd34d" stroke="${INK}" stroke-width="6"/><path d="M120 394 L280 376 M120 376 L280 394" stroke="${DIRT}" stroke-width="12" stroke-linecap="round"/></g>
      </svg>`);
      add("s1", `<div id="kill1" class="abs label" style="left:0;top:10px;width:1080px;opacity:0;color:${BLUE}">kills germs ✓</div>`);
      add("s1", `<div id="fuel1" class="abs" style="left:40px;top:300px;width:220px;text-align:center;opacity:0"><svg viewBox="0 0 160 160" width="150" height="150">${iFlame}</svg><div class="small">fuel</div></div>`);
      add("s1", `<div id="time1" class="abs" style="left:820px;top:300px;width:220px;text-align:center;opacity:0"><svg viewBox="0 0 160 160" width="150" height="150">${iClock}<line id="hand1" x1="80" y1="80" x2="80" y2="34" stroke="${BLUE}" stroke-width="9" stroke-linecap="round"/></svg><div class="small">time</div></div>`);
      add("s1", `<svg id="vil" class="abs" style="left:0;top:0" width="1080" height="1080"><g transform="translate(20 760) scale(0.9)">${[0, 175, 350, 525, 700, 875, 1050].map(house).join("")}</g></svg>`);
      add("s1", `<div id="vq" class="abs label" style="left:0;top:960px;width:1080px;opacity:0">a whole village? ✗</div>`);
      tl.set(".hs", { opacity: 0 }, T[1]);
      tl.fromTo("#s1 .cam", focus(540, 360, 1.25), { ...focus(540, 400, 1.1), duration: 1.0, ease: "power2.out" }, T[1]);
      tl.fromTo(".bub", { y: 0, opacity: 0 }, { y: -150, opacity: 1, duration: 0.7, ease: "power1.in", stagger: { each: 0.12, repeat: 6 } }, T[1] + 0.2);
      tl.to("#bgerms > g", { scale: 0, opacity: 0, transformOrigin: "50% 50%", duration: 0.3, stagger: 0.1 }, W(1, "kills"));
      pop("#kill1", W(1, "germs"));
      pop("#fuel1", W(1, "fuel") - 0.1);
      tl.fromTo("#flame", { scale: 1 }, { scale: 1.15, transformOrigin: "50% 100%", duration: 0.2, yoyo: true, repeat: 3 }, W(1, "fuel"));
      pop("#time1", W(1, "time") - 0.1);
      tl.fromTo("#hand1", { rotation: 0 }, { rotation: 360, svgOrigin: "80 80", duration: 1.0, ease: "none" }, W(1, "time"));
      tl.to("#s1 .cam", { ...focus(540, 560, 1.0), duration: 0.6, ease: "power2.inOut" }, W(1, "hard") - 0.3);
      tl.to(".hs", { opacity: 1, duration: 0.1, stagger: 0.08 }, W(1, "whole") - 0.3);
      pop("#vq", W(1, "village"));

      /* ================= S2 · filters ================= */
      let fd = "";

      tl.fromTo(".fz", { y: 0, opacity: 0 }, { y: -100, opacity: 1, duration: 0.6, ease: "power1.out", stagger: { each: 0.1, repeat: 3 } }, W(4, "tablet") + 0.3);

      /* ================= S5 · lab proof ================= */

      const gcard = (id, left, art, name) => `<div id="${id}" class="abs" style="left:${left}px;top:500px;width:300px;text-align:center"><svg viewBox="-60 -50 120 100" width="220" height="180">${art}<g class="gx" stroke="${BLUE}" stroke-width="10" stroke-linecap="round"><line x1="-45" y1="-40" x2="45" y2="40"/><line x1="45" y1="-40" x2="-45" y2="40"/></g></svg><div class="label" style="font-size:52px">${name}</div></div>`;
      const vib = `<g><path d="M-30 10 C-30 -20 10 -30 30 -10" stroke="${INK}" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M-30 10 C-30 -20 10 -30 30 -10" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M30 -10 q10 10 22 4" stroke="${INK}" stroke-width="3.5" fill="none"/></g>`;
      add("s5", `<div id="nhl" class="abs" style="left:0;top:395px;width:1080px;text-align:center"><span class="chip" style="font-size:44px">NATIONAL HEALTH LABS ✓</span></div>`);
      add("s5", gcard("gc1", 50, bacterium(0, 0, 1.4, ""), "E. coli") + gcard("gc2", 390, bacterium(0, 0, 1.2, "").replace(/#1e7fd8/g, DIRT), "Salmonella") + gcard("gc3", 730, vib, "cholera"));
      add("s5", `<div id="rl" class="abs label" style="left:0;top:800px;width:1080px;opacity:0">even in <span style="color:${BLUE}">river</span> &amp; <span style="color:${BLUE}">lake</span> water ✓</div>`);
      tl.set(["#lab1", "#lab2", "#gc1", "#gc2", "#gc3", ".gx", "#nhl"], { opacity: 0 }, T[5]);
      pop("#nhl", T[5] + 0.15);
      tl.fromTo("#s5 .cam", focus(540, 260, 1.15), { ...focus(540, 300, 1.05), duration: 2.5, ease: "none" }, T[5]);
      pop("#lab1", W(5, "cameroon") - 0.2); pop("#lab2", W(5, "niger") - 0.2);
      tl.to("#s5 .cam", { ...focus(540, 560, 1.0), duration: 0.6, ease: "power2.inOut" }, W(5, "eliminated") - 0.5);
      [["#gc1", "coli"], ["#gc2", "salmonella"], ["#gc3", "cholera"]].forEach(([g, w]) => {
        pop(g, W(5, w) - 0.3);
        tl.fromTo(`${g} .gx`, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.2, ease: "back.out(3)" }, W(5, w) + 0.2);
      });
      pop("#rl", W(5, "river") - 0.2);

      /* ================= S6 · no fuel, no equipment, cost ================= */
      add("s6", `<div id="nf" class="abs" style="left:110px;top:60px;text-align:center;width:300px"><svg viewBox="0 0 160 160" width="220" height="220">${iFlame}${cross}</svg><div class="small">no fuel</div></div>
        <div id="ne" class="abs" style="left:670px;top:60px;text-align:center;width:300px"><svg viewBox="0 0 160 160" width="220" height="220">${iGear}${cross}</svg><div class="small">no equipment</div></div>
        <div id="cost" class="abs" style="left:140px;top:470px;width:800px;padding:36px 30px;border:8px solid ${INK};border-radius:36px;background:${BLUE};color:#fff;text-align:center">
          <div style="font-family:Cap;font-weight:900;font-size:150px;line-height:1">€0.50</div>
          <div style="font-family:Cap;font-weight:800;font-size:46px;margin-top:10px">per person · per month</div></div>`);
      tl.set(["#nf", "#ne", "#cost"], { opacity: 0 }, T[6]);
      tl.fromTo("#s6 .cam", focus(540, 520, 1.08), { ...focus(540, 540, 1.0), duration: 4.0, ease: "none" }, T[6]);
      pop("#nf", W(6, "fuel") - 0.2); pop("#ne", W(6, "equipment") - 0.2);
      pop("#cost", W(6, "fifty") - 0.3);

      /* ================= S7 · comparison table ================= */
      const MK = { y: `<span style="color:${BLUE}">✓</span>`, n: `<span>✗</span>`, m: `<span style="color:${MUTED}">~</span>` };
      const rows = [["boiling", iPot, "y", "y", "n", "n"], ["filters", iFilter, "m", "y", "y", "m"], ["chlorine tabs", iChlor, "y", "n", "y", "y"], ["AquaCore", iAqua, "y", "y", "y", "y"]];

      rows.forEach(([n, ic, ...v], i) => {
        const top = 150 + i * 190, hi = i === 3;
        tbl += `<div id="r${i}" class="abs" style="left:20px;top:${top}px;width:1040px;height:170px;border-radius:26px;${hi ? `background:${SKY};border:7px solid ${BLUE};` : `border-bottom:5px solid ${SKY};`}">
          <svg class="abs" style="left:14px;top:25px" viewBox="0 0 160 160" width="110" height="110">${ic}</svg>
          <div class="abs ${hi ? "" : "label"}" style="left:130px;top:52px;text-align:left;${hi ? `font-family:Cap;font-weight:900;font-size:44px;color:${BLUE}` : "font-size:46px"}">${n}</div>
          ${v.map((x, j) => `<div class="abs label mk${i}" style="left:${360 + j * 170}px;top:30px;width:170px;font-size:96px">${MK[x]}</div>`).join("")}</div>`;
      });
      add("s7", tbl);
      tl.set(["#hdr", "#r0", "#r1", "#r2", "#r3"], { opacity: 0 }, T[7]);
      tl.fromTo("#s7 .cam", focus(540, 540, 1.04), { ...focus(540, 540, 1.0), duration: 5, ease: "none" }, T[7]);
      tl.to("#hdr", { opacity: 1, duration: 0.25 }, T[7] + 0.05);
      ["#r0", "#r1", "#r2"].forEach((r, i) => tl.fromTo(r, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, T[7] + 0.2 + i * 0.35));
      tl.fromTo("#r3", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, W(7, "one"));

      tl.fromTo("#r3", { scale: 1 }, { scale: 1.04, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, W(7, "box") + 0.5);

      /* ================= S8 · arsenic + teaser ep 5 ================= */
      const tube = `<svg viewBox="0 0 120 300" width="110" height="275"><g fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"><path d="M20 20 L100 20 M34 20 L34 250 a26 26 0 0 0 52 0 L86 20"/></g><path d="M38 150 L82 150 L82 250 a22 22 0 0 1 -44 0 Z" fill="${SKY}"/></svg>`;
      add("s8", `<div id="as8" class="abs" style="left:170px;top:60px;text-align:center"><svg viewBox="-50 -40 100 80" width="260" height="208">${tile("As", 0, 0, "")}</svg><div class="small">arsenic</div></div>
        <div id="tb8" class="abs" style="left:640px;top:30px;text-align:center">${tube}<div class="chip" style="display:inline-block;margin-top:6px">TEST FIRST</div></div>`);
      add("s8", `<div id="next" class="abs" style="left:90px;top:560px;width:900px;padding:28px 40px;border:8px solid ${INK};border-radius:30px;background:${BLUE};color:#fff;text-align:center">
        <div style="font-family:Cap;font-weight:900;font-size:44px;letter-spacing:0.08em">NEXT · EP. 5 →</div>
        <div style="font-family:Hand;font-size:64px;line-height:1.05;margin-top:6px">How is water actually tested?</div></div>`);
      add("s8", `<div id="src" class="abs" style="left:0;top:950px;width:1080px;text-align:center;font-family:Cap;font-weight:800;font-size:30px;color:${MUTED}">Sources: Centre Pasteur du Cameroun (2012) · LANSPEX Niger (2017)</div>`);
      tl.set(["#as8", "#tb8", "#next"], { opacity: 0 }, T[8]);
      tl.fromTo("#s8 .cam", focus(540, 300, 1.15), { ...focus(540, 480, 1.0), duration: 3.0, ease: "power1.inOut" }, T[8]);
      pop("#as8", W(8, "arsenic") - 0.3); pop("#tb8", W(8, "test") - 0.2);
      tl.fromTo("#next", { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, W(8, "next") - 0.2);

      /* ================= S9 · end card ================= */
      add("s9", `<div class="abs" style="left:0;top:60px;width:1080px;text-align:center">
        <img id="logo" src="assets/logo.png" style="width:380px;height:380px" />
        <div id="e1" style="font-family:Cap;font-weight:900;font-size:60px;letter-spacing:0.02em;margin-top:10px">WATER: <span style="color:${BLUE}">WHAT WE DON'T SEE</span></div>
        <div id="e2" style="font-family:Cap;font-weight:800;font-size:40px;color:${MUTED};margin-top:6px">EPISODE 4 · aquacoreglobal.com</div>
        <div id="e3" style="display:inline-block;margin-top:40px;padding:22px 40px;border:7px solid ${INK};border-radius:40px;font-family:Hand;font-size:56px">Could this work in <span style="color:${BLUE}">your</span> community? 💬</div>
      </div>`);
      pop("#logo", T[9] + 0.05);
      tl.fromTo("#e1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, T[9] + 0.3);
      tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, T[9] + 0.5);
      pop("#e3", T[9] + 0.8);
      tl.fromTo("#logo", { scale: 1 }, { scale: 1.06, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, T[9] + 1.0);

      /* ================= captions ================= */
      const KEY = /^(boiling|filters|chlorine|tablets|safe|germs|fuel|time|village|dirt|viruses|cleaning|cheap|cloudy|survive|aquacore|dioxide|tablet|litres|minutes|cameroon|niger|coli|salmonella|cholera|river|lake|equipment|fifty|one|box|arsenic|test|next)$/i;
      const capsEl = document.getElementById("caps");
      TIMED.forEach((words, li) => {
        let chunk = [], chunks = [];
        words.forEach((x, i) => {
          chunk.push(x);
          const len = chunk.map((c) => c.w).join(" ").length;
          if (/[,.?!:]$/.test(x.w) || chunk.length >= 4 || len > 18 || i === words.length - 1) { chunks.push(chunk); chunk = []; }
        });
        chunks.forEach((c, ci) => {
          const id = `c${li}_${ci}`;
          capsEl.insertAdjacentHTML("beforeend", `<div id="${id}" class="cap">${c.map((x, wi) => `<span id="${id}_${wi}"${KEY.test(x.w.replace(/[^\w]/g, "")) ? ' class="k"' : ""}>${x.w}</span>`).join(" ")}</div>`);
          const cs = c[0].t, ce = ci < chunks.length - 1 ? chunks[ci + 1][0].t : c[c.length - 1].t + c[c.length - 1].d + 0.15;
          tl.fromTo(`#${id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08 }, cs);
          tl.set(`#${id}`, { opacity: 0 }, ce);
          c.forEach((x, wi) => tl.fromTo(`#${id}_${wi}`, { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, x.t));
        });
      });

      if (document.documentElement.dataset.format === "landscape") {
        tl.fromTo("#stage", { scale: 0.92, x: 0, transformOrigin: "0 0" }, { scale: 0.92, x: 0, duration: 0.01 }, 0);
        tl.to("#stage", { x: 393, duration: 0.5, ease: "power2.inOut" }, 54.3);
      }
      tl.set({}, {}, 57.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
