<!doctype html>
<html lang="en" data-resolution="portrait" data-format="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Raw Water Check</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #111418; --blue: #1e7fd8; --sky: #dff2fc; --muted: #8b96a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; background: #fff; font-family: "Hand", sans-serif; color: var(--ink); overflow: hidden; }
      .abs { position: absolute; }
      svg { overflow: visible; }
      #frame { position: absolute; left: 208px; top: 200px; width: 664px; height: 1200px; border: 9px solid var(--ink); border-radius: 34px; overflow: hidden; background: #000; }
      .fv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      #dim { position: absolute; inset: 0; background: rgba(10,14,20,0.42); opacity: 0; }
      .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; padding: 10px 28px; border: 5px solid var(--ink); border-radius: 999px; font-family: "Cap"; font-weight: 900; font-size: 34px; letter-spacing: 0.04em; background: #fff; }
      .pill b { color: var(--blue); }
      .chip { font-family: "Cap"; font-weight: 900; letter-spacing: 0.05em; padding: 8px 26px; border-radius: 16px; background: var(--blue); color: #fff; border: 5px solid var(--ink); white-space: nowrap; display: inline-block; }
      .claim { background: #ffd34d; color: var(--ink); }
      .stamp { font-family: "Cap"; font-weight: 900; font-size: 70px; color: #d64545; border: 9px solid #d64545; border-radius: 18px; padding: 6px 26px; background: rgba(255,255,255,0.92); white-space: nowrap; display: inline-block; letter-spacing: 0.03em; }
      .card { background: #fff; border: 7px solid var(--ink); border-radius: 26px; }
      .rc { position: absolute; left: 232px; width: 616px; top: 1070px; padding: 18px 26px 20px; }
      .rc .h { font-family: "Cap"; font-weight: 900; font-size: 30px; color: #fff; background: var(--blue); display: inline-block; padding: 4px 18px; border-radius: 10px; letter-spacing: 0.08em; }
      .rc .t { font-family: "Cap"; font-weight: 800; font-size: 40px; line-height: 1.15; margin-top: 12px; }
      .rc .s { font-family: "Cap"; font-weight: 800; font-size: 22px; color: var(--muted); margin-top: 10px; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1410px; height: 210px; }
      .cap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Cap"; font-weight: 900; font-size: 68px; line-height: 1.1; color: var(--ink); opacity: 0; }
      .cap span { display: inline-block; margin: 0 0.06em; }
      .cap span.k { color: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="46.9" data-width="1080" data-height="1920">
      <audio id="vo" class="clip" src="assets/voice.wav" data-start="0" data-duration="46.9"></audio>
      <div id="tag" class="abs" style="left:0;top:95px;width:1080px;text-align:center"><div class="pill"><img src="assets/logo-drop.png" style="height:46px;width:auto" />REALITY CHECK · <b>RAW WATER</b></div></div>
      <div id="frame">
      <img id="hk" class="clip fv" src="assets/fr_14.0.jpg" data-start="0" data-duration="6.8" />
      <video id="vid1" class="clip fv" src="assets/clip.mp4" data-start="6.8" data-duration="1.75" data-media-start="0.45" muted playsinline></video>
      <img id="frz1" class="clip fv" src="assets/fr_2.15.jpg" data-start="8.55" data-duration="1.76" />
      <video id="vid2" class="clip fv" src="assets/clip.mp4" data-start="10.31" data-duration="1.2" data-media-start="2.2" muted playsinline></video>
      <img id="frz2" class="clip fv" src="assets/fr_3.35.jpg" data-start="11.51" data-duration="5.17" />
      <video id="vid3" class="clip fv" src="assets/clip.mp4" data-start="16.68" data-duration="3.3" data-media-start="3.4" muted playsinline></video>
      <img id="frz3" class="clip fv" src="assets/fr_6.6.jpg" data-start="19.98" data-duration="6.39" />
      <video id="vid4" class="clip fv" src="assets/clip.mp4" data-start="26.37" data-duration="2.5" data-media-start="8.9" muted playsinline></video>
      <img id="frz4" class="clip fv" src="assets/fr_11.35.jpg" data-start="28.87" data-duration="4.02" />
      <video id="vid5" class="clip fv" src="assets/clip.mp4" data-start="32.89" data-duration="2.0" data-media-start="11.4" muted playsinline></video>
      <img id="frz5" class="clip fv" src="assets/fr_13.35.jpg" data-start="34.89" data-duration="4.2" />
        <div id="concl" class="clip abs" data-start="39.09" data-duration="4.61" style="inset:0;background:#fff"></div>
        <div id="dim"></div>
        <div id="cred" class="abs" style="left:18px;top:18px;font-family:Cap;font-weight:800;font-size:22px;color:#fff;background:rgba(0,0,0,0.55);padding:6px 14px;border-radius:10px">Video: @erikharding.health · TikTok · Jul 2026</div>
      </div>
      <div id="ov" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
      <div id="endc" class="clip abs" data-start="43.7" data-duration="3.2" style="left:0;top:0;width:1080px;height:1920px;background:#fff"></div>
      <div id="guideLayer" class="abs" style="left:0;top:0;width:1080px;height:1920px;z-index:5"></div>
      <div id="caps"></div>
    </div>
    <script>
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", MUTED = "#8b96a3", RED = "#d64545";
      const LINES = [[0.2, 6.25, "He says this is what he drinks to live longer than you. Over three thousand people saved it. Let's check the facts."], [6.95, 2.96, "Most water is aging you? There's no evidence for that."], [10.46, 5.82, "Chlorine and fluoride? In tiny, regulated amounts. Chlorine is what keeps germs out of the pipes."], [16.83, 9.14, "No treatment plant, just a spring? In Montana, nineteen people got sick after drinking untreated water from a spot locals had trusted for decades."], [26.52, 5.97, "You can taste the difference? Germs have no taste, no smell and no colour. Only a lab test can tell."], [33.04, 5.66, "And if you can't get it? He recommends bottled mineral water. Tested and regulated. Not raw."], [39.24, 4.01, "The water that helps you live longer isn't raw. It's tested, and treated."]];
      const T = [0.0, 6.8, 10.31, 16.68, 26.37, 32.89, 39.09, 43.7, 46.9];
      const TIMED = LINES.map(([start, dur, text]) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/\d/.test(w) ? 6 : 0) + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        let t = start + 0.1; const span = dur - 0.25;
        return words.map((w, i) => { const d = (wts[i] / total) * span; const o = { w, t, d }; t += d; return o; });
      });
      const W = (li, word, nth = 0) => { const m = TIMED[li].filter((x) => x.w.toLowerCase().replace(/[^\w']/g, "") === word.toLowerCase()); return (m[nth] || m[0]).t; };
      function figure(id, { left, top, w, prop = "", face = "smile" }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
            <g class="f-sick" opacity="${show("sick")}"><path d="M76 70 L92 80 M92 70 L76 80 M108 70 L124 80 M124 70 L108 80" stroke-width="6"/><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry", "sick"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
        tl.set(`#${id} .eyes`, { opacity: face === "sick" ? 0 : 1 }, t);
      }
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, extra = {}) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", ...extra }, t);
      const slam = (sel, t, rot = -6) => tl.fromTo(sel, { scale: 2.2, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, rotation: rot, duration: 0.28, ease: "back.out(2.2)" }, t);
      const ov = (html) => document.getElementById("ov").insertAdjacentHTML("beforeend", html);
      const hide = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.15 }, t);
      const CL = [["CLAIM #1", "NO EVIDENCE", "No study shows that treated tap water “ages” you.", ""], ["CLAIM #2", "TINY &amp; REGULATED", "Legal limits: chlorine ≤ 4 mg/L · fluoride ≤ 4 mg/L. Chlorine kills germs in the pipes.", "Source: US EPA drinking-water standards"], ["CLAIM #3", "RISKY", "Montana, 2022: 19 people sick (Campylobacter) after drinking untreated water from a spot used for decades.", "Source: CDC MMWR, April 2023"], ["CLAIM #4", "TASTE ≠ SAFE", "Germs have no taste, no smell and no colour. Only a lab test can tell.", ""], ["PLAN B", "PLOT TWIST", "His backup: bottled mineral water. Tested and regulated. Not raw.", ""]];

      /* ---------- HOOK ---------- */
      ov(`<div id="hq" class="abs" style="left:0;top:320px;width:1080px;text-align:center;opacity:0"><span class="chip claim" style="font-size:44px">CLAIM: “LIVE LONGER”</span></div>`);
      ov(`<div id="hs" class="abs" style="left:0;top:960px;width:1080px;text-align:center;opacity:0"><span class="stamp" style="font-size:84px">LIVE LONGER?</span></div>`);
      ov(`<div id="hl" class="abs" style="left:248px;top:1180px;opacity:0"><span class="chip" style="font-size:38px;background:${INK}">♥ 20.6K</span></div><div id="hv" class="abs" style="left:538px;top:1180px;opacity:0"><span class="chip" style="font-size:38px">🔖 <span id="hvn">0</span> saves</span></div>`);
      tl.fromTo("#frame", { scale: 0.9, opacity: 0, transformOrigin: "50% 40%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 0);
      tl.fromTo("#hk", { scale: 1.0 }, { scale: 1.12, duration: T[1], ease: "none", transformOrigin: "50% 35%" }, 0);
      slam("#hq", 0.25, -3);
      slam("#hs", W(0, "longer") - 0.1, -6);
      pop("#hl", W(0, "three") - 0.2); pop("#hv", W(0, "saved") - 0.4);
      { const o = { v: 0 }; tl.to(o, { v: 3194, duration: 1.0, ease: "power2.out", onUpdate: () => { document.getElementById("hvn").textContent = Math.round(o.v).toLocaleString("en-US"); } }, W(0, "saved") - 0.3); }
      tl.to("#dim", { opacity: 1, duration: 0.2 }, W(0, "check") - 0.2);
      hide(["#hq", "#hs", "#hl", "#hv"], T[1] - 0.15);
      tl.set("#dim", { opacity: 0 }, T[1]);

      /* ---------- CLAIMS ---------- */
      CL.forEach(([lab, stamp, txt, srcT], k) => {
        const i = k + 1, ts = T[i], te = T[i + 1];
        ov(`<div id="cl${i}" class="abs" style="left:232px;top:270px;opacity:0"><span class="chip claim" style="font-size:40px">${lab}</span></div>`);
        ov(`<div id="st${i}" class="abs" style="left:0;top:760px;width:1080px;text-align:center;opacity:0"><span class="stamp">${stamp}</span></div>`);
        ov(`<div id="rc${i}" class="rc card" style="opacity:0"><span class="h">REALITY</span><div class="t">${txt}</div>${srcT ? `<div class="s">${srcT}</div>` : ""}</div>`);
        pop(`#cl${i}`, ts + 0.05);
        const fz = ts + (+document.getElementById("vid" + i).dataset.duration);
        tl.fromTo(`#frz${i}`, { scale: 1 }, { scale: 1.08, duration: Math.max(0.5, te - fz), ease: "none", transformOrigin: "50% 40%" }, fz);
        // the rebuttal lands on the second sentence of the line
        const tr = TIMED[i].find((x, j) => j > 0 && /[?]$/.test(TIMED[i][j - 1].w)) || TIMED[i][Math.floor(TIMED[i].length / 3)];
        tl.to("#dim", { opacity: 1, duration: 0.2 }, Math.max(fz, tr.t - 0.1));
        slam(`#st${i}`, tr.t - 0.05, k % 2 ? 5 : -6);
        tl.fromTo(`#rc${i}`, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, tr.t + 0.35);
        hide([`#cl${i}`, `#st${i}`, `#rc${i}`], te - 0.12);
        tl.set("#dim", { opacity: 0 }, te);
      });

      /* ---------- CONCLUSION ---------- */
      document.getElementById("concl").insertAdjacentHTML("beforeend", `
        <div class="abs" style="left:0;top:120px;width:646px;text-align:center"><span id="c1" class="chip" style="font-size:46px;background:${RED};text-decoration:line-through">RAW</span></div>
        <div id="cg" class="abs" style="left:180px;top:260px">${glass("cgl", { left: 0, top: 0, w: 270 })}</div>
        <div id="c2" class="abs" style="left:0;top:700px;width:646px;text-align:center"><span class="chip" style="font-size:54px">TESTED ✓</span></div>
        <div id="c3" class="abs" style="left:0;top:820px;width:646px;text-align:center"><span class="chip" style="font-size:54px">TREATED ✓</span></div>
        <div id="c4" class="abs" style="left:30px;top:960px;width:586px;text-align:center;font-family:Hand;font-size:50px;line-height:1.1">the water that helps you live longer</div>`);
      tl.set(["#c1", "#cg", "#c2", "#c3", "#c4"], { opacity: 0 }, T[6]);
      pop("#c1", W(6, "raw") - 0.15); pop("#cg", T[6] + 0.1);
      slam("#c2", W(6, "tested") - 0.1, -3); slam("#c3", W(6, "treated") - 0.1, 3);
      tl.to("#c4", { opacity: 1, duration: 0.3 }, W(6, "longer"));
      tl.set("#cred", { opacity: 0 }, T[6]);

      /* ---------- END CARD ---------- */
      document.getElementById("endc").insertAdjacentHTML("beforeend", `<div class="abs" style="left:0;top:330px;width:1080px;text-align:center">
        <img id="logo" src="assets/logo-horizontal.png" style="width:760px;height:auto" />
        <div id="e1" style="font-family:Cap;font-weight:900;font-size:56px;margin-top:40px">REALITY CHECK: <span style="color:${BLUE}">RAW WATER</span></div>
        <div id="e2" style="font-family:Cap;font-weight:800;font-size:40px;color:${MUTED};margin-top:8px">aquacoreglobal.com</div>
        <div id="e3" style="display:inline-block;margin-top:46px;padding:22px 42px;border:7px solid ${INK};border-radius:40px;font-family:Hand;font-size:58px">Would <span style="color:${BLUE}">you</span> drink raw water? 💬</div>
        <div id="e4" style="font-family:Cap;font-weight:800;font-size:24px;color:${MUTED};margin-top:40px">Original video: @erikharding.health (TikTok, Jul 2026) · Sources: CDC MMWR 2023 · US EPA</div></div>`);
      pop("#logo", T[7] + 0.05);
      tl.fromTo("#e1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, T[7] + 0.25);
      tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, T[7] + 0.4);
      pop("#e3", T[7] + 0.6); tl.to("#e4", { opacity: 1, duration: 0.3 }, T[7] + 0.9); tl.set("#e4", { opacity: 0 }, 0);
      tl.set(["#tag", "#caps"], { opacity: 1 }, 0); tl.set("#tag", { opacity: 0 }, T[7]);

      /* ================= GUIDE: presenter + pointing finger ================= */
      const GW = 150, GS = GW / 200;
      document.getElementById("guideLayer").insertAdjacentHTML("beforeend", figure("guide", { left: 0, top: 0, w: GW, face: "smile" }) +
        `<div id="finger" class="abs" style="left:0;top:0;width:84px;height:116px;opacity:0"><svg width="84" height="116" viewBox="0 0 84 116"><path d="M24 10 a9 9 0 0 1 18 0 L42 52 L46 48 a8 8 0 0 1 13 5 L59 56 a8 8 0 0 1 13 5 L72 64 a8 8 0 0 1 11 7 L83 92 C83 106 72 114 58 114 L40 114 C30 114 22 107 18 99 L4 72 a9 9 0 0 1 14 -9 L24 72 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M42 52 L42 74 M59 56 L59 76 M72 64 L72 80" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></svg></div>`);
      const G = { x: 0, y: 0, rl: 0, rr: 0, fx: 540, fy: 1200, fo: 0, base: "smile" };
      const gFaces = ["smile", "o", "hmm", "worry", "sick"];
      const gFace = (face, t) => { gFaces.forEach((f) => tl.set(`#guide .f-${f}`, { opacity: f === face ? 1 : 0 }, t)); };
      const gArms = (rl, rr, t, d = 0.3) => {
        tl.fromTo("#guide .armL", { rotation: G.rl }, { rotation: rl, svgOrigin: "100 150", duration: d, ease: "power2.out" }, t);
        tl.fromTo("#guide .armR", { rotation: G.rr }, { rotation: rr, svgOrigin: "100 150", duration: d, ease: "power2.out" }, t);
        G.rl = rl; G.rr = rr;
      };
      // place the guide at a scene start (jump cut + little bounce)
      const gAt = (x, y, t, base = "smile") => {
        if (G.fo) { tl.fromTo("#finger", { opacity: 1 }, { opacity: 0, duration: 0.12 }, t - 0.12); G.fo = 0; }
        tl.set("#guide", { x, y }, t);
        tl.fromTo("#guide", { scaleY: 0.85, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "back.out(3)" }, t);
        G.x = x; G.y = y; G.base = base; gFace(base, t); gArms(0, 0, t, 0.01);
      };
      // point an arm and the finger at a stage point (tx, ty)
      const gPoint = (tx, ty, t) => {
        const sx = G.x + 100 * GS, sy = G.y + 150 * GS;
        const ang = (Math.atan2(ty - sy, tx - sx) * 180) / Math.PI;
        if (tx >= sx) gArms(0, ang - 53.7, t); else gArms(ang - 126.3, 0, t);
        const nx = tx - 33, ny = ty + 30;
        tl.fromTo("#finger", { x: G.fx, y: G.fy, opacity: G.fo }, { x: nx, y: ny, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo("#finger svg", { scale: 1 }, { scale: 0.82, transformOrigin: "40% 0%", duration: 0.09, yoyo: true, repeat: 1 }, t + 0.35);
        G.fx = nx; G.fy = ny; G.fo = 1;
      };
      const gHideFinger = (t) => { tl.fromTo("#finger", { opacity: G.fo, x: G.fx, y: G.fy }, { opacity: 0, x: G.fx, y: G.fy, duration: 0.2 }, t); G.fo = 0; };
      // talking: mouth opens on each word of a line, then returns to the base face
      const gTalk = (li) => TIMED[li].forEach((x) => { gFace("o", x.t); gFace(G.base, x.t + x.d * 0.55); });
      const gBase = (face, t) => { G.base = face; gFace(face, t); };


      // presenter beside the frame, bottom right
      const GX = 905, GY = 1110;
      gAt(GX, GY, 0, "hmm"); gTalk(0);
      gPoint(540, 350, 0.3);
      gPoint(540, 1060, W(0, "longer"));
      gPoint(678, 1210, W(0, "saved") - 0.2);

        const tr = TIMED[i].find((x, j) => j > 0 && /[?]$/.test(TIMED[i][j - 1].w)) || TIMED[i][Math.floor(TIMED[i].length / 3)];
