    <script>
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", MUTED = "#8b96a3", RED = "#d64545", YEL = "#ffd34d";
      const LINES = [[0.2, 6.25, "He says this is what he drinks to live longer than you. Over three thousand people saved it. Let's check the facts."], [6.95, 2.96, "Most water is aging you? There's no evidence for that."], [10.46, 5.82, "Chlorine and fluoride? In tiny, regulated amounts. Chlorine is what keeps germs out of the pipes."], [16.83, 9.14, "No treatment plant, just a spring? In Montana, nineteen people got sick after drinking untreated water from a spot locals had trusted for decades."], [26.52, 5.97, "You can taste the difference? Germs have no taste, no smell and no colour. Only a lab test can tell."], [33.04, 5.66, "And if you can't get it? He recommends bottled mineral water. Tested and regulated. Not raw."], [39.24, 4.01, "The water that helps you live longer isn't raw. It's tested, and treated."]];
      const T = [0.0, 6.8, 10.31, 16.68, 26.37, 32.89, 39.09, 44.0, 47.2];
      const TIMED = LINES.map(([start, dur, text]) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/\d/.test(w) ? 6 : 0) + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        let t = start + 0.1; const span = dur - 0.25;
        return words.map((w, i) => { const d = (wts[i] / total) * span; const o = { w, t, d }; t += d; return o; });
      });
      const W = (li, word, nth = 0) => { const m = TIMED[li].filter((x) => x.w.toLowerCase().replace(/[^\w']/g, "") === word.toLowerCase()); return (m[nth] || m[0]).t; };
      function figure(id, { left, top, w, prop = "", face = "smile" }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
            <g class="f-sick" opacity="${show("sick")}"><path d="M76 70 L92 80 M92 70 L76 80 M108 70 L124 80 M124 70 L108 80" stroke-width="6"/><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry", "sick"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
        tl.set(`#${id} .eyes`, { opacity: face === "sick" ? 0 : 1 }, t);
      }
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }

      const tl = gsap.timeline({ paused: true });
      const SFX = []; window.__sfx = SFX; const sfx = (k, t) => SFX.push([k, Math.max(0, +(+t).toFixed(3))]);
      const pop = (sel, t, extra = {}) => sfx("pop", t) && tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.4)", ...extra }, t);
      const slam = (sel, t, rot = -4) => sfx("thud", t + 0.12) && tl.fromTo(sel, { scale: 2.2, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, rotation: rot, duration: 0.26, ease: "back.out(2.2)" }, t);
      const add = (id, html) => document.getElementById(id).insertAdjacentHTML("beforeend", html);
      const out = (sel, t) => tl.to(sel, { opacity: 0, scale: 0.9, duration: 0.14 }, t);
      const title = (id, [a, h, b], top = 215) => `<div id="${id}" class="ttl" style="top:${top}px"><span class="w">${a}</span><span class="hl">${h}</span><span class="w">${b}</span></div>`;
      const titleIn = (id, t) => { sfx("whoosh", t - 0.05); tl.fromTo(`#${id} .w, #${id} .hl`, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, stagger: 0.08, ease: "back.out(2)" }, t); tl.fromTo(`#${id} .hl`, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, t + 0.08); };
      const CL = [[["1 ·", "“AGING”", "water"], "Most water is aging you.", ["Source he gives: <b>none</b>", "Scientific evidence: <b>none</b>"], "✗ NO EVIDENCE", "#d64545", ""], [["2 ·", "CHLORINE", "&amp; fluoride"], "Tap water has chlorine and fluoride.", ["Chlorine limit: <b>≤ 4 mg/L</b>", "Fluoride limit: <b>≤ 4 mg/L</b>", "Chlorine kills germs in the pipes <b>✓</b>"], "⚖ TINY &amp; REGULATED", "#e08a1e", "US EPA drinking-water standards"], [["3 ·", "“JUST A", "spring”"], "No treatment plant, just a spring.", ["Montana · <b>2022</b>", "<b>19</b> people sick", "Bug: <b>Campylobacter</b>", "Spot used for <b>decades</b>"], "⚠ RISKY", "#d64545", "CDC MMWR, April 2023"], [["4 ·", "“TASTE”", "test"], "You can taste the difference.", ["👅 taste <b>✗</b>", "👃 smell <b>✗</b>", "👁 colour <b>✗</b>", "🧪 lab test <b>✓</b>"], "✗ TASTE ≠ SAFE", "#d64545", ""], [["5 ·", "PLAN", "B"], "If it doesn't deliver near you, get Icelandic or Gerolsteiner.", ["Bottled mineral water", "tested <b>✓</b>", "regulated <b>✓</b>", "raw <b>✗</b>"], "↻ PLOT TWIST", "#1e7fd8", ""]];

      /* ================= HOOK: full-screen clip -> card ================= */
      add("hov", `<div id="hs" class="abs" style="left:0;top:820px;width:1080px;text-align:center;opacity:0"><span class="verdict" style="background:${RED};font-size:96px">LIVE LONGER?</span></div>`);
      add("hov", title("ht", ["", "LIVE", "longer? 🤔"]));
      add("hov", `<div id="hl" class="abs" style="left:540px;top:520px;opacity:0"><span class="sticker" style="font-size:44px">♥ <b>20.6K</b> likes</span></div>
        <div id="hv" class="abs" style="left:540px;top:640px;opacity:0"><span class="sticker" style="font-size:44px;background:${YEL}">🔖 <b id="hvn">0</b> saves</span></div>
        <div id="hq" class="abs" style="left:540px;top:780px;width:470px;opacity:0" ><div class="quote" style="position:relative;left:0;top:0;width:470px"><div class="who">@ERIKHARDING.HEALTH SAYS</div><div class="q">“what I drink to live longer than you”</div></div></div>`);
      tl.set("#ht .w, #ht .hl", { opacity: 0 }, 0);
      tl.fromTo("#hk img", { scale: 1.0 }, { scale: 1.15, duration: 2.6, ease: "none", transformOrigin: "50% 30%" }, 0);
      slam("#hs", W(0, "longer") - 0.12, -4);
      const shrink = W(0, "over") - 0.35;
      tl.to("#hs", { opacity: 0, scale: 0.6, duration: 0.2 }, shrink - 0.1);
      tl.fromTo("#hk", { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: 0, borderRadius: 0, transformOrigin: "0% 0%" }, { x: 80, y: 430, scaleX: 400 / 1080, scaleY: 722 / 1920, rotation: -4, borderRadius: 70, duration: 0.55, ease: "power3.inOut" }, shrink);
      tl.fromTo("#hkb", { opacity: 0 }, { opacity: 1, duration: 0.3 }, shrink + 0.2);
      titleIn("ht", shrink + 0.3);
      sfx("whoosh", shrink); sfx("pop", W(0, "three") - 0.25); sfx("pop", W(0, "saved") - 0.45);
      tl.fromTo("#hl", { x: 300, opacity: 0, rotation: 6 }, { x: 0, opacity: 1, rotation: 3, duration: 0.3, ease: "back.out(2)" }, W(0, "three") - 0.25);
      tl.fromTo("#hv", { x: 300, opacity: 0, rotation: -6 }, { x: 0, opacity: 1, rotation: -3, duration: 0.3, ease: "back.out(2)" }, W(0, "saved") - 0.45);
      { const o = { v: 0 }; tl.to(o, { v: 3194, duration: 0.9, ease: "power2.out", onUpdate: () => { document.getElementById("hvn").textContent = Math.round(o.v).toLocaleString("en-US"); } }, W(0, "saved") - 0.3); }
      pop("#hq", W(0, "saved") + 0.15, { rotation: 2 });

      /* ================= SPLASH: branded interstitial ================= */
      let rays = ""; for (let k = 0; k < 16; k++) rays += `<path d="M540 900 L${540 + Math.cos((k * 2 * Math.PI) / 16 - 0.1) * 1400} ${900 + Math.sin((k * 2 * Math.PI) / 16 - 0.1) * 1400} L${540 + Math.cos((k * 2 * Math.PI) / 16 + 0.1) * 1400} ${900 + Math.sin((k * 2 * Math.PI) / 16 + 0.1) * 1400} Z" fill="${k % 2 ? "#cfe6fa" : "#e9f4fd"}"/>`;
      add("splash", `<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#f6fafe"></div><svg id="rays" class="abs" style="left:0;top:0" width="1080" height="1920">${rays}</svg>
        <div id="sp1" class="abs" style="left:290px;top:650px;width:500px;height:500px;border-radius:250px;background:#fff;border:12px solid ${INK};display:flex;flex-direction:column;align-items:center;justify-content:center">
          <img src="assets/logo-drop.png" style="height:150px;width:auto" />
          <div style="font-family:Cap;font-weight:900;font-size:64px;line-height:1;margin-top:10px">REALITY</div>
          <div style="font-family:Cap;font-weight:900;font-size:64px;line-height:1;color:#fff;background:${BLUE};padding:4px 22px;border-radius:14px;border:5px solid ${INK};margin-top:6px;transform:rotate(-3deg)">CHECK</div></div>
        <div id="sp2" class="abs" style="left:0;top:1200px;width:1080px;text-align:center"><span class="sticker" style="font-size:46px">5 claims · <b>the data decides</b></span></div>`);
      sfx("whoosh", 5.2 - 0.1); sfx("ding", 5.2 + 0.12);
      tl.fromTo("#rays", { rotation: 0, opacity: 0 }, { rotation: 25, opacity: 1, duration: T[1] - 5.2, ease: "none", svgOrigin: "540 900" }, 5.2);
      tl.fromTo("#sp1", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, 5.2 + 0.05);
      tl.fromTo("#sp2", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, 5.2 + 0.35);

      /* ================= CLAIMS ================= */
      CL.forEach(([ttl, quote, stick, verdict, vcol, srcT], k) => {
        const i = k + 1, ts = T[i], te = T[i + 1];
        add("ov", title("tt" + i, ttl));
        add("ov", `<div id="q${i}" class="quote" style="opacity:0"><div class="who">@ERIKHARDING.HEALTH SAYS</div><div class="q">“${quote}”</div></div>`);
        add("ov", stick.map((s, j) => `<div id="s${i}_${j}" class="abs" style="left:${530 + (j % 2) * 20}px;top:${720 + j * 104}px;opacity:0"><span class="sticker">${s}</span></div>`).join(""));
        add("ov", `<div id="v${i}" class="abs" style="left:0;top:1215px;width:1080px;text-align:center;opacity:0"><span class="verdict" style="background:${vcol}">${verdict}</span></div>`);
        if (srcT) add("ov", `<div id="src${i}" class="abs src" style="left:0;top:1338px;width:1080px;text-align:center;opacity:0">Source: ${srcT}</div>`);
        tl.set(`#tt${i} .w, #tt${i} .hl`, { opacity: 0 }, 0);
        titleIn("tt" + i, ts + 0.02);
        tl.set(`#card${i}`, { opacity: 0 }, 0); tl.set(`#card${i}`, { opacity: 1 }, ts); tl.set(`#card${i}`, { opacity: 0 }, te);
        // clip card flies in from the left, tilts, plays; then nudges aside when the data lands
        sfx("whoosh", ts); sfx("whoosh", te - 0.25);
        tl.fromTo(`#card${i}`, { x: -560, rotation: -14 }, { x: 0, rotation: k % 2 ? 3 : -3, duration: 0.42, ease: "back.out(1.6)" }, ts);
        pop(`#q${i}`, ts + 0.3, { rotation: k % 2 ? -2 : 2 });
        const tr = TIMED[i].find((x, j) => j > 0 && /[?]$/.test(TIMED[i][j - 1].w)) || TIMED[i][Math.floor(TIMED[i].length / 3)];
        const span = Math.max(1.2, te - tr.t - 1.3);
        stick.forEach((s, j) => sfx("pop", tr.t + (j * span) / stick.length));
        stick.forEach((s, j) => tl.fromTo(`#s${i}_${j}`, { x: 220, opacity: 0, rotation: 8 }, { x: 0, opacity: 1, rotation: j % 2 ? 2 : -2, duration: 0.28, ease: "back.out(2.2)" }, tr.t + (j * span) / stick.length));
        tl.to(`#card${i}`, { scale: 0.92, y: -10, duration: 0.3, ease: "power2.out" }, tr.t);
        slam(`#v${i}`, te - 1.15, k % 2 ? 3 : -3);
        if (srcT) tl.to(`#src${i}`, { opacity: 1, duration: 0.2 }, te - 0.95);
        out([`#tt${i}`, `#q${i}`, ...stick.map((s, j) => `#s${i}_${j}`), `#v${i}`, ...(srcT ? [`#src${i}`] : [])], te - 0.14);
        tl.to(`#card${i}`, { x: 900, rotation: 16, duration: 0.2, ease: "power2.in" }, te - 0.2);
      });

      /* ================= SCOREBOARD + CONCLUSION ================= */
      add("concl", title("tc", ["THE", "SCORE", ""]));
      const SC = [["“Aging” water", "✗", RED], ["Chlorine &amp; fluoride", "⚖", "#e08a1e"], ["“Just a spring”", "⚠", RED], ["Taste the difference", "✗", RED], ["Plan B: bottled", "↻", BLUE]];
      add("concl", SC.map(([n, ic, c], j) => `<div id="sc${j}" class="abs" style="left:110px;top:${380 + j * 120}px;width:860px;height:100px;background:#fff;border:6px solid ${INK};border-radius:20px;display:flex;align-items:center;gap:24px;padding:0 24px;opacity:0">
        <div style="width:60px;height:60px;border-radius:30px;background:${c};color:#fff;font-family:Cap;font-weight:900;font-size:38px;display:flex;align-items:center;justify-content:center;border:4px solid ${INK}">${ic}</div>
        <div style="font-family:Cap;font-weight:800;font-size:40px">${n}</div></div>`).join(""));
      add("concl", `<div id="cr" class="abs" style="left:0;top:1015px;width:1080px;text-align:center;opacity:0"><span class="verdict" style="background:${RED};text-decoration:line-through">RAW</span></div>
        <div id="ct" class="abs" style="left:0;top:1150px;width:1080px;text-align:center;opacity:0"><span class="verdict" style="background:${BLUE}">TESTED ✓ TREATED ✓</span></div>`);
      tl.set("#tc .w, #tc .hl", { opacity: 0 }, 0);
      titleIn("tc", T[6] + 0.02);
      SC.forEach((x, j) => sfx("pop", T[6] + 0.15 + j * 0.16));
      SC.forEach((x, j) => tl.fromTo(`#sc${j}`, { x: -700, opacity: 0 }, { x: 0, opacity: 1, duration: 0.26, ease: "back.out(1.8)" }, T[6] + 0.15 + j * 0.16));
      slam("#cr", W(6, "raw") - 0.1, -4);
      slam("#ct", W(6, "tested") - 0.1, 2);

      /* ================= END CARD ================= */
      add("endc", `<div class="abs" style="left:0;top:330px;width:1080px;text-align:center">
        <img id="logo" src="assets/logo-horizontal.png" style="width:760px;height:auto" />
        <div id="e1" style="font-family:Cap;font-weight:900;font-size:56px;margin-top:40px">REALITY CHECK: <span style="color:${BLUE}">RAW WATER</span></div>
        <div id="e2" style="font-family:Cap;font-weight:800;font-size:40px;color:${MUTED};margin-top:8px">aquacoreglobal.com</div>
        <div id="e3" style="display:inline-block;margin-top:46px;padding:22px 42px;border:7px solid ${INK};border-radius:40px;font-family:Hand;font-size:58px">Would <span style="color:${BLUE}">you</span> drink raw water? 💬</div>
        <div id="e4" style="font-family:Cap;font-weight:800;font-size:24px;color:${MUTED};margin-top:40px">Original video: @erikharding.health (TikTok, Jul 2026) · Sources: CDC MMWR 2023 · US EPA</div></div>`);
      pop("#logo", T[7] + 0.05); sfx("ding", T[7] + 0.1);
      tl.fromTo("#e1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, T[7] + 0.25);
      tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, T[7] + 0.4);
      pop("#e3", T[7] + 0.6);

      /* ================= GUIDE: presenter + pointing finger ================= */
      const GW = 140, GS = GW / 200;
      document.getElementById("guideLayer").insertAdjacentHTML("beforeend", figure("guide", { left: 0, top: 0, w: GW, face: "smile" }) +
        `<div id="finger" class="abs" style="left:0;top:0;width:84px;height:116px;opacity:0"><svg width="84" height="116" viewBox="0 0 84 116"><path d="M24 10 a9 9 0 0 1 18 0 L42 52 L46 48 a8 8 0 0 1 13 5 L59 56 a8 8 0 0 1 13 5 L72 64 a8 8 0 0 1 11 7 L83 92 C83 106 72 114 58 114 L40 114 C30 114 22 107 18 99 L4 72 a9 9 0 0 1 14 -9 L24 72 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M42 52 L42 74 M59 56 L59 76 M72 64 L72 80" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></svg></div>`);
      const G = { x: 0, y: 0, rl: 0, rr: 0, fx: 540, fy: 1200, fo: 0, base: "smile" };
      const gFaces = ["smile", "o", "hmm", "worry", "sick"];
      const gFace = (face, t) => { gFaces.forEach((f) => tl.set(`#guide .f-${f}`, { opacity: f === face ? 1 : 0 }, t)); };
      const gArms = (rl, rr, t, d = 0.3) => {
        tl.fromTo("#guide .armL", { rotation: G.rl }, { rotation: rl, svgOrigin: "100 150", duration: d, ease: "power2.out" }, t);
        tl.fromTo("#guide .armR", { rotation: G.rr }, { rotation: rr, svgOrigin: "100 150", duration: d, ease: "power2.out" }, t);
        G.rl = rl; G.rr = rr;
      };
      // place the guide at a scene start (jump cut + little bounce)
      const gAt = (x, y, t, base = "smile") => {
        if (G.fo) { tl.fromTo("#finger", { opacity: 1 }, { opacity: 0, duration: 0.12 }, t - 0.12); G.fo = 0; }
        tl.set("#guide", { x, y }, t);
        tl.fromTo("#guide", { scaleY: 0.85, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "back.out(3)" }, t);
        G.x = x; G.y = y; G.base = base; gFace(base, t); gArms(0, 0, t, 0.01);
      };
      // point an arm and the finger at a stage point (tx, ty)
      const gPoint = (tx, ty, t) => {
        const sx = G.x + 100 * GS, sy = G.y + 150 * GS;
        const ang = (Math.atan2(ty - sy, tx - sx) * 180) / Math.PI;
        if (tx >= sx) gArms(0, ang - 53.7, t); else gArms(ang - 126.3, 0, t);
        const nx = tx - 33, ny = ty + 30;
        tl.fromTo("#finger", { x: G.fx, y: G.fy, opacity: G.fo }, { x: nx, y: ny, opacity: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo("#finger svg", { scale: 1 }, { scale: 0.82, transformOrigin: "40% 0%", duration: 0.09, yoyo: true, repeat: 1 }, t + 0.35);
        G.fx = nx; G.fy = ny; G.fo = 1; sfx("click", t + 0.36);
      };
      const gHideFinger = (t) => { tl.fromTo("#finger", { opacity: G.fo, x: G.fx, y: G.fy }, { opacity: 0, x: G.fx, y: G.fy, duration: 0.2 }, t); G.fo = 0; };
      // talking: mouth opens on each word of a line, then returns to the base face
      const gTalk = (li) => TIMED[li].forEach((x) => { gFace("o", x.t); gFace(G.base, x.t + x.d * 0.55); });
      const gBase = (face, t) => { G.base = face; gFace(face, t); };


      // presenter: bottom-right, talks and points at the verdicts
      const GX = 910, GY = 1130;
      gAt(GX, GY, 0, "hmm"); gTalk(0);
      gPoint(540, 960, W(0, "longer") + 0.1);
      gPoint(760, 735, W(0, "saved") - 0.2);
      CL.forEach((c, k) => {
        const i = k + 1, te = T[i + 1];
        gAt(GX, GY, T[i], k === 4 ? "o" : "hmm"); gTalk(i);
        const tr = TIMED[i].find((x, j) => j > 0 && /[?]$/.test(TIMED[i][j - 1].w)) || TIMED[i][Math.floor(TIMED[i].length / 3)];
        gPoint(280, 1150, tr.t + 0.05);
        gPoint(540, 1300, te - 1.0);
      });
      gAt(GX, GY, T[6], "smile"); gTalk(6);
      gPoint(540, 1235, W(6, "tested") + 0.1);
      gHideFinger(T[7] - 0.15);
      gAt(470, 1450, T[7], "smile");
      tl.fromTo("#guide .armR", { rotation: 0 }, { rotation: -150, svgOrigin: "100 150", duration: 0.3 }, T[7] + 0.2);
      tl.fromTo("#guide .armR", { rotation: -150 }, { rotation: -110, svgOrigin: "100 150", duration: 0.25, yoyo: true, repeat: 7, ease: "sine.inOut" }, T[7] + 0.5);
      tl.set("#caps", { opacity: 0 }, T[7]); tl.set("#caps", { opacity: 1 }, 0);
      tl.set("#guideLayer", { opacity: 0 }, 5.2); tl.set("#guideLayer", { opacity: 1 }, T[1]); tl.set("#guideLayer", { opacity: 1 }, 0);

      const KEY = /^(live|longer|three|thousand|saved|facts|aging|evidence|chlorine|fluoride|tiny|regulated|germs|pipes|treatment|spring|montana|nineteen|sick|untreated|decades|taste|smell|colour|lab|test|bottled|mineral|tested|raw|treated)$/i;
      /* ================= captions ================= */
      const capsEl = document.getElementById("caps");
      TIMED.forEach((words, li) => {
        let chunk = [], chunks = [];
        words.forEach((x, i) => {
          chunk.push(x);
          const len = chunk.map((c) => c.w).join(" ").length;
          if (/[,.?!:]$/.test(x.w) || chunk.length >= 4 || len > 18 || i === words.length - 1) { chunks.push(chunk); chunk = []; }
        });
        chunks.forEach((c, ci) => {
          const id = `c${li}_${ci}`;
          capsEl.insertAdjacentHTML("beforeend", `<div id="${id}" class="cap">${c.map((x, wi) => `<span id="${id}_${wi}"${KEY.test(x.w.replace(/[^\w]/g, "")) ? ' class="k"' : ""}>${x.w}</span>`).join(" ")}</div>`);
          const cs = c[0].t, ce = ci < chunks.length - 1 ? chunks[ci + 1][0].t : c[c.length - 1].t + c[c.length - 1].d + 0.15;
          tl.fromTo(`#${id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08 }, cs);
          tl.set(`#${id}`, { opacity: 0 }, ce);
          c.forEach((x, wi) => tl.fromTo(`#${id}_${wi}`, { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, x.t));
        });
      });


      tl.set({}, {}, 47.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
