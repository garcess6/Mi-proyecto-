<!doctype html>
<html lang="en" data-resolution="landscape" data-format="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>River, Well or Rain</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root {
        --ground: #ffffff;
        --ink: #111418;
        --blue: #1e7fd8;
        --sky: #dff2fc;
        --teal: #2ec4d6;
        --dirt: #8a7660;
        --muted: #8b96a3;
        --W: 1080px;
        --H: 1920px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: "Hand", sans-serif; color: var(--ink); overflow: hidden; }

      /* ---------- layout: stage (1080x1080 drawing area), captions, series tag ---------- */
      #stage { position: absolute; width: 1080px; height: 1080px; left: 0; top: 300px; transform-origin: 0 0; overflow: hidden; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1420px; height: 260px; }
      #tag { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; }
      html[data-format="landscape"] { --W: 1920px; --H: 1080px; }
      html[data-format="landscape"] #stage { left: 70px; top: 43px; }
      html[data-format="landscape"] #caps { left: 1120px; width: 740px; top: 360px; height: 420px; }
      html[data-format="landscape"] #tag { left: 1120px; width: 740px; top: 150px; }
      html[data-format="landscape"] .cap { font-size: 84px; }
      html[data-format="landscape"] .pill { font-size: 28px; }

      .scene { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; }
      .abs { position: absolute; }
      svg { overflow: visible; }

      .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; padding: 10px 28px; border: 5px solid var(--ink); border-radius: 999px; font-family: "Cap"; font-weight: 900; font-size: 34px; letter-spacing: 0.04em; background: #fff; }
      .pill b { color: var(--blue); }
      .label { font-family: "Hand"; font-size: 66px; line-height: 1; text-align: center; }
      .chip { font-family: "Cap"; font-weight: 900; font-size: 52px; letter-spacing: 0.06em; padding: 8px 30px; border-radius: 18px; background: var(--blue); color: #fff; border: 5px solid var(--ink); }

      /* captions */
      .cap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Cap"; font-weight: 900; font-size: 76px; line-height: 1.12; color: var(--ink); opacity: 0; }
      .cap span { display: inline-block; margin: 0 0.06em; }
      .cap span.k { color: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.5" data-width="1920" data-height="1080">
      <audio id="vo" class="clip" src="assets/voice.wav" data-start="0" data-duration="44.5" data-track-index="9"></audio>

      <div id="tag" class="clip" data-start="1.6" data-duration="40" data-track-index="8">
        <div class="pill">EP. 1 · <b>WATER:</b> WHAT WE DON'T SEE</div>
      </div>

      <div id="stage">
        <div id="s0" class="scene clip" data-start="0" data-duration="1.6" data-track-index="1"><div class="cam"></div></div>
        <div id="s1" class="scene clip" data-start="1.6" data-duration="7.4" data-track-index="1"><div class="cam"></div></div>
        <div id="s3" class="scene clip" data-start="9" data-duration="5.3" data-track-index="1"><div class="cam"></div></div>
        <div id="s4" class="scene clip" data-start="14.3" data-duration="5.3" data-track-index="1"><div class="cam"></div></div>
        <div id="s5" class="scene clip" data-start="19.6" data-duration="4.7" data-track-index="1"><div class="cam"></div></div>
        <div id="s6" class="scene clip" data-start="24.3" data-duration="5" data-track-index="1"><div class="cam"></div></div>
        <div id="s7" class="scene clip" data-start="29.3" data-duration="7.8" data-track-index="1"><div class="cam"></div></div>
        <div id="s8" class="scene clip" data-start="37.1" data-duration="4.5" data-track-index="1"><div class="cam"></div></div>
        <div id="s9" class="scene clip" data-start="41.6" data-duration="2.9" data-track-index="1"><div class="cam"></div></div>
      </div>

      <div id="caps"></div>
    </div>

    <script>
      /* ================= helpers ================= */
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", DIRT = "#8a7660", MUTED = "#8b96a3", TEAL = "#2ec4d6";
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const cam = (id) => document.getElementById(id).getElementsByClassName("cam")[0];
      const add = (id, html) => cam(id).insertAdjacentHTML("beforeend", html);
      const addTop = (id, html) => document.getElementById(id).insertAdjacentHTML("beforeend", html);
      // camera transform that centres point (px,py) at scale s
      const focus = (px, py, s) => ({ x: 540 - px * s, y: 540 - py * s, scale: s });

      // stick figure (viewBox 200x360). prop: "glass" | "lens" | ""
      function figure(id, { left, top, w, prop = "", face = "smile" }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : prop === "lens"
            ? `<g class="prop"><line x1="144" y1="210" x2="160" y2="186" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><circle cx="176" cy="160" r="30" fill="${SKY}" fill-opacity="0.7" stroke="${INK}" stroke-width="8"/><path d="M162 150 Q168 140 178 138" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
      }

      // a glass of water (viewBox 160x220); extra = svg drawn inside the water
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }
      const microbe = (x, y, s = 1, cls = "mic") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><ellipse rx="15" ry="10" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="-4" cy="-1" r="2.6" fill="${INK}"/><circle cx="5" cy="2" r="2.2" fill="${BLUE}"/><path d="M15 0 q6 -6 12 0 t10 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>`;
      const dot = (x, y, r, fill, cls) => `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${INK}" stroke-width="3"/>`;
      const dropPath = (x, y, s, fill, cls, stroke = INK) =>
        `<g transform="translate(${x} ${y})"><path class="${cls}" transform="scale(${s})" d="M0 -18 C-5 -8 -11 -2 -11 5 a11 11 0 0 0 22 0 C11 -2 5 -8 0 -18 Z" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/></g>`;
      const leaf = (x, y, r, cls) =>
        `<g class="${cls}" transform="translate(${x} ${y}) rotate(${r})"><path d="M-16 0 Q0 -14 16 0 Q0 14 -16 0 Z" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M-12 0 L14 0" stroke="${INK}" stroke-width="3"/></g>`;

      const riverIcon = `<svg viewBox="0 0 120 80" width="120" height="80"><g fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"><path d="M8 22 Q24 8 40 22 T72 22 T104 22"/><path d="M8 44 Q24 30 40 44 T72 44 T104 44" stroke="${BLUE}"/><path d="M8 66 Q24 52 40 66 T72 66 T104 66"/></g></svg>`;
      const wellIcon = `<svg viewBox="0 0 120 80" width="120" height="80"><g fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M22 34 L60 6 L98 34"/><line x1="34" y1="26" x2="34" y2="50"/><line x1="86" y1="26" x2="86" y2="50"/><rect x="22" y="50" width="76" height="26" rx="4" fill="#fff"/><line x1="60" y1="20" x2="60" y2="38" stroke="${BLUE}"/></g></svg>`;
      const rainIcon = `<svg viewBox="0 0 120 80" width="120" height="80"><g fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 48 a16 16 0 0 1 4 -31 a22 22 0 0 1 42 -2 a17 17 0 0 1 12 33 Z" fill="#fff"/><line x1="40" y1="60" x2="34" y2="74" stroke="${BLUE}"/><line x1="62" y1="60" x2="56" y2="74" stroke="${BLUE}"/><line x1="84" y1="60" x2="78" y2="74" stroke="${BLUE}"/></g></svg>`;

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, extra = {}) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", ...extra }, t);
      const wiggle = (sel, t, dur) => tl.fromTo(sel, { rotation: -14 }, { rotation: 14, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 0.25)), svgOrigin: "0 0" }, t);

      /* ================= S0 · hook (0 – 1.6) ================= */
      add("s0", figure("f0", { left: 340, top: 180, w: 400, prop: "glass", face: "smile" }));
      addTop("s0", `<div id="wait" class="abs" style="left:0;top:40px;width:1080px;text-align:center;font-family:Cap;font-weight:900;font-size:180px;color:${BLUE};-webkit-text-stroke:8px ${INK};paint-order:stroke fill;opacity:0">WAIT!</div>`);
      addTop("s0", `<svg class="abs" style="left:0;top:0" width="1080" height="1080"><g id="burst" stroke="${INK}" stroke-width="9" stroke-linecap="round" opacity="0"><line x1="150" y1="90" x2="100" y2="50"/><line x1="130" y1="180" x2="60" y2="180"/><line x1="930" y1="90" x2="980" y2="50"/><line x1="950" y1="180" x2="1020" y2="180"/></g></svg>`);
      tl.fromTo("#f0 .armR", { rotation: 0 }, { rotation: -92, svgOrigin: "100 150", duration: 0.7, ease: "power2.inOut" }, 0.05);
      tl.fromTo("#s0 .cam", focus(540, 540, 1), { ...focus(560, 420, 1.25), duration: 1.5, ease: "power1.inOut" }, 0);
      tl.fromTo("#wait", { scale: 2.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.25, ease: "back.out(3)" }, 0.8);
      tl.to("#burst", { opacity: 1, duration: 0.05 }, 0.85);
      setFace(tl, "f0", "o", 0.85);
      tl.fromTo("#s0 .cam", { rotation: 0 }, { rotation: 1.5, duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, 0.85);

      /* ================= S1 · three glasses (1.6 – 9.0) ================= */
      const GX = [90, 430, 770];
      const glassExtras = [
        microbe(60, 120, 1.1, "m1") + dot(100, 170, 8, DIRT, "m1") + microbe(100, 145, 0.9, "m1") + dot(55, 180, 6, DIRT, "m1"),
        "",
        "",
      ];
      ["g1", "g2", "g3"].forEach((g, i) => add("s1", glass(g, { left: GX[i], top: 70, w: 220, extra: glassExtras[i] })));
      [riverIcon, wellIcon, rainIcon].forEach((ic, i) =>
        add("s1", `<div id="lb${i}" class="abs" style="left:${GX[i] - 20}px;top:390px;width:260px;text-align:center">${ic}<div class="label">${["RIVER", "WELL", "RAIN"][i]}</div></div>`)
      );
      add("s1", `<div id="eq1" class="abs label" style="left:325px;top:150px;width:90px;font-size:120px;opacity:0">=</div><div id="eq2" class="abs label" style="left:665px;top:150px;width:90px;font-size:120px;opacity:0">=</div>`);
      add("s1", figure("f1", { left: 440, top: 600, w: 220, prop: "lens", face: "hmm" }));
      add("s1", `<div id="q1" class="abs label" style="left:640px;top:560px;font-size:140px;color:${BLUE};opacity:0">?</div>`);
      add("s1", `<div id="lens1" class="abs" style="left:40px;top:60px;width:320px;height:320px;opacity:0"><svg viewBox="0 0 320 320" width="320" height="320"><circle cx="150" cy="150" r="120" fill="#fff" stroke="${INK}" stroke-width="14"/><g>${microbe(110, 120, 2.2, "lm")}${microbe(190, 180, 1.8, "lm")}${dot(150, 210, 14, DIRT, "lm")}${microbe(120, 200, 1.4, "lm")}</g><line x1="236" y1="236" x2="300" y2="300" stroke="${INK}" stroke-width="22" stroke-linecap="round"/></svg></div>`);
      tl.set("#f1 .prop", { opacity: 0 }, 1.6);
      tl.set(".m1", { opacity: 0 }, 1.6);
      pop("#g1", 1.75); pop("#lb0", 1.8);
      pop("#g2", 2.25); pop("#lb1", 2.3);
      pop("#g3", 2.75); pop("#lb2", 2.8);
      tl.fromTo("#f1", { y: 500 }, { y: 0, duration: 0.5, ease: "power3.out" }, 3.1);
      pop("#q1", 3.6, { rotation: 10 });
      tl.fromTo("#f1 .armL", { rotation: 0 }, { rotation: 60, svgOrigin: "100 150", duration: 0.4 }, 3.6);
      tl.fromTo("#s1 .cam", focus(540, 540, 1), { ...focus(540, 480, 1.08), duration: 3.4, ease: "none" }, 1.6);
      ["#g1", "#g2", "#g3"].forEach((g, i) => tl.fromTo(`${g} .wave`, { x: 0 }, { x: -8, duration: 0.5, yoyo: true, repeat: 13, ease: "sine.inOut" }, 1.6 + i * 0.15));
      pop("#eq1", 5.3); pop("#eq2", 5.5);
      tl.to("#q1", { opacity: 0, duration: 0.2 }, 6.6);
      tl.to("#f1 .armL", { rotation: 0, svgOrigin: "100 150", duration: 0.3 }, 6.6);
      setFace(tl, "f1", "smile", 6.7);
      tl.set("#f1 .prop", { opacity: 1 }, 6.8);
      tl.fromTo("#f1 .armR", { rotation: 0 }, { rotation: -70, svgOrigin: "100 150", duration: 0.35, ease: "back.out(2)" }, 6.8);
      tl.to(["#eq1", "#eq2"], { opacity: 0, duration: 0.2 }, 7.2);
      tl.to("#s1 .cam", { ...focus(200, 230, 2.0), duration: 0.8, ease: "power3.inOut" }, 7.4);
      pop("#lens1", 8.0);
      tl.set(".m1", { opacity: 1 }, 8.0);
      wiggle("#lens1 .wig", 8.1, 0.9);

      /* ================= S3 · river (9.0 – 14.3) ================= */
      let fieldRows = "";
      for (let i = 0; i < 7; i++) fieldRows += `<path d="M${20 + i * 6} ${340 + i * 55} L${340 - i * 6} ${300 + i * 55}" stroke="${INK}" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round"/>`;
      const house = (x, y, s, cls) =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><path d="M-60 0 L0 -50 L60 0" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><rect x="-46" y="-6" width="92" height="76" fill="#fff" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/><rect x="-12" y="30" width="24" height="40" fill="${BLUE}" stroke="${INK}" stroke-width="6"/></g>`;
      let soil = "", rmic = "", poll = "";
      for (let i = 0; i < 9; i++) soil += dot(240 + rnd() * 100, 380 + rnd() * 260, 8 + rnd() * 6, DIRT, "soil");
      [[470, 380], [520, 560], [440, 720], [580, 880], [610, 300]].forEach(([x, y], i) => (rmic += microbe(x, y, 1.3, "rmic")));
      for (let i = 0; i < 5; i++) poll += dropPath(760, 640, 1.1, "#4a4f57", "poll");
      add("s3", `<svg class="abs" style="left:0;top:0" width="1080" height="1080" viewBox="0 0 1080 1080">
        <path id="rbody" d="M380 -20 C420 300 300 600 520 1100 L820 1100 C580 600 680 300 640 -20 Z" fill="${SKY}"/>
        <path class="redge" d="M380 -20 C420 300 300 600 520 1100" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
        <path class="redge" d="M640 -20 C680 300 580 600 820 1100" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
        <g id="rwaves" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round">
          <path d="M460 160 q20 -14 40 0 t40 0"/><path d="M420 440 q20 -14 40 0 t40 0"/><path d="M500 640 q20 -14 40 0 t40 0"/><path d="M560 900 q20 -14 40 0 t40 0"/></g>
        <g id="field"><path d="M0 330 L350 290 L320 700 L0 760 Z" fill="#fff" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>${fieldRows}</g>
        ${house(860, 210, 1, "rh")}${house(960, 400, 0.8, "rh")}${house(820, 860, 0.9, "rh")}
        <g id="pipe"><rect x="740" y="600" width="140" height="44" rx="6" fill="#fff" stroke="${INK}" stroke-width="8"/><line x1="770" y1="600" x2="770" y2="644" stroke="${INK}" stroke-width="5"/></g>
        ${soil}${poll}${rmic}
      </svg>`);
      addTop("s3", `<div id="t3" class="abs" style="left:40px;top:40px"><div class="chip">RIVER</div></div>`);
      tl.fromTo("#s3 .cam", focus(540, 540, 1.25), { ...focus(540, 540, 1.0), duration: 1.0, ease: "power2.out" }, 9.0);
      tl.fromTo(".redge", { strokeDasharray: 1400, strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 9.0);
      tl.fromTo("#rbody", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.2);
      tl.fromTo("#rwaves", { x: 0 }, { x: 30, duration: 5.3, ease: "none" }, 9.0);
      pop("#t3", 9.1);
      tl.fromTo("#field", { x: -420 }, { x: 0, duration: 0.5, ease: "power3.out" }, 9.6);
      pop(".rh", 10.0, { stagger: 0.12 });
      tl.to("#s3 .cam", { ...focus(380, 520, 1.35), duration: 0.6, ease: "power2.inOut" }, 10.7);
      $$(".soil").forEach((d, i) => tl.to(d, { x: 200 + i * 8, y: 40 + (i % 3) * 30, duration: 0.9, ease: "power1.in" }, 11.0 + i * 0.06));
      pop(".rmic", 11.8, { stagger: 0.08 });
      wiggle(".rmic .wig", 11.9, 2.4);
      tl.to("#s3 .cam", { ...focus(640, 660, 1.4), duration: 0.6, ease: "power2.inOut" }, 12.4);
      $$(".poll").forEach((d, i) => tl.fromTo(d, { x: 0, y: 0, opacity: 0 }, { x: -70 - i * 14, y: 40 + i * 30, opacity: 1, duration: 0.6, ease: "power1.in" }, 12.7 + i * 0.12));
      tl.to("#s3 .cam", { ...focus(560, 700, 1.9), duration: 0.7, ease: "power3.inOut" }, 13.5);

      /* ================= S4 · well (14.3 – 19.6) ================= */
      let soilTex = "", rocks = "", minerals = "", seep = "";
      for (let i = 0; i < 40; i++) soilTex += `<circle cx="${20 + rnd() * 1040}" cy="${290 + rnd() * 210}" r="${3 + rnd() * 3}" fill="${MUTED}"/>`;
      for (let i = 0; i < 9; i++) rocks += `<path d="M${30 + i * 120} ${760 + (i % 2) * 40} l40 -26 l46 14 l-10 40 l-60 8 Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;

      const KEY = /^(river|well|rain|rainwater|soil|microbes|pollution|underground|seepage|ground|roofs|gutters|tanks|dirt|germs|risks|clear|safe|test|treatment|check|everything|contaminated|next)$/i;
      const capsEl = $("#caps");
      LINES.forEach(([start, dur, text], li) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        const s0 = start + 0.1, span = dur - 0.25;
        let t = s0, chunk = [], chunks = [];
        words.forEach((w, i) => {
          const d = (wts[i] / total) * span;
          chunk.push({ w, t, d });
          t += d;
          const len = chunk.map((c) => c.w).join(" ").length;
          if (/[,.?!:]$/.test(w) || chunk.length >= 4 || len > 18 || i === words.length - 1) { chunks.push(chunk); chunk = []; }
        });
        chunks.forEach((c, ci) => {
          const id = `c${li}_${ci}`;
          capsEl.insertAdjacentHTML("beforeend", `<div id="${id}" class="cap">${c.map((x, wi) => `<span id="${id}_${wi}"${KEY.test(x.w.replace(/[^\w]/g, "")) ? ' class="k"' : ""}>${x.w}</span>`).join(" ")}</div>`);
          const cs = c[0].t, ce = ci < chunks.length - 1 ? chunks[ci + 1][0].t : c[c.length - 1].t + c[c.length - 1].d + 0.15;
          tl.fromTo(`#${id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08 }, cs);
          tl.set(`#${id}`, { opacity: 0 }, ce);
          c.forEach((x, wi) => tl.fromTo(`#${id}_${wi}`, { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, x.t));
        });
      });

      if (document.documentElement.dataset.format === "landscape") {
        tl.fromTo("#stage", { scale: 0.92, x: 0, transformOrigin: "0 0" }, { scale: 0.92, x: 0, duration: 0.01 }, 0);
        tl.to("#stage", { x: 393, duration: 0.5, ease: "power2.inOut" }, 41.6);
      }
      tl.set({}, {}, 44.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
