<!doctype html>
<html lang="en" data-resolution="landscape" data-format="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>About AquaCore</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ground: #ffffff; --ink: #111418; --blue: #1e7fd8; --sky: #dff2fc; --muted: #8b96a3; --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: "Hand", sans-serif; color: var(--ink); overflow: hidden; }
      #stage { position: absolute; width: 1080px; height: 1080px; left: 0; top: 300px; transform-origin: 0 0; overflow: hidden; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1420px; height: 260px; }
      #tag { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; }
      html[data-format="landscape"] { --W: 1920px; --H: 1080px; }
      html[data-format="landscape"] #stage { left: 70px; top: 43px; }
      html[data-format="landscape"] #caps { left: 1120px; width: 740px; top: 360px; height: 420px; }
      html[data-format="landscape"] #tag { left: 1120px; width: 740px; top: 150px; }
      html[data-format="landscape"] .cap { font-size: 84px; }
      html[data-format="landscape"] .pill { font-size: 28px; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; }
      .abs { position: absolute; }
      svg { overflow: visible; }
      .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; padding: 10px 28px; border: 5px solid var(--ink); border-radius: 999px; font-family: "Cap"; font-weight: 900; font-size: 34px; letter-spacing: 0.04em; background: #fff; }
      .pill b { color: var(--blue); }
      .label { font-family: "Hand"; font-size: 66px; line-height: 1; text-align: center; }
      .small { font-family: "Hand"; font-size: 48px; line-height: 1; text-align: center; }
      .chip { font-family: "Cap"; font-weight: 900; font-size: 52px; letter-spacing: 0.06em; padding: 8px 30px; border-radius: 18px; background: var(--blue); color: #fff; border: 5px solid var(--ink); }
      .card { background: #fff; border: 8px solid var(--ink); border-radius: 28px; text-align: center; }
      .cap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Cap"; font-weight: 900; font-size: 76px; line-height: 1.12; color: var(--ink); opacity: 0; }
      .cap span { display: inline-block; margin: 0 0.06em; }
      .cap span.k { color: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="41.39" data-width="1920" data-height="1080">
      <audio id="vo" class="clip" src="assets/voice_en.wav" data-start="0" data-duration="41.39" data-track-index="9"></audio>
      <div id="tag" class="clip" data-start="0" data-duration="38.89" data-track-index="8">
        <div class="pill">ABOUT US · <b>AQUACORE</b></div>
      </div>
      <div id="stage">
        <div id="s0" class="scene clip" data-start="0" data-duration="3.82" data-track-index="1"><div class="cam"></div></div>
        <div id="s1" class="scene clip" data-start="3.82" data-duration="8.71" data-track-index="1"><div class="cam"></div></div>
        <div id="s2" class="scene clip" data-start="12.53" data-duration="6.06" data-track-index="1"><div class="cam"></div></div>
        <div id="s3" class="scene clip" data-start="18.59" data-duration="6.17" data-track-index="1"><div class="cam"></div></div>
        <div id="s4" class="scene clip" data-start="24.76" data-duration="5.59" data-track-index="1"><div class="cam"></div></div>
        <div id="s5" class="scene clip" data-start="30.35" data-duration="3.86" data-track-index="1"><div class="cam"></div></div>
        <div id="s6" class="scene clip" data-start="34.21" data-duration="4.68" data-track-index="1"><div class="cam"></div></div>
        <div id="s7" class="scene clip" data-start="38.89" data-duration="2.5" data-track-index="1"><div class="cam"></div></div>
      </div>
      <div id="caps"></div>
    </div>

    <script>
      /* ================= helpers ================= */
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", MUTED = "#8b96a3", DIRT = "#8a7660", GRAY = "#4a4f57";
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const cam = (id) => document.getElementById(id).getElementsByClassName("cam")[0];
      const add = (id, html) => cam(id).insertAdjacentHTML("beforeend", html);
      const addTop = (id, html) => document.getElementById(id).insertAdjacentHTML("beforeend", html);
      const focus = (px, py, s) => ({ x: 540 - px * s, y: 540 - py * s, scale: s });

      /* voice lines: [start, duration, text]; word times are estimated from these */
      const LINES = [
        [0.3, 3.07, "We're AquaCore. Safe water starts with what you can't see."],
        [3.82, 8.26, "Water can look clear, and still make people sick. Millions of families drink from rivers, wells and rain tanks that are never tested or treated."],
        [12.53, 5.61, "So we made water treatment simple: chlorine dioxide tablets, and a local network to deliver them."],
        [18.59, 5.72, "Fill a twenty-five litre container. Add one tablet. Wait thirty minutes. Ready to drink and cook."],
        [24.76, 5.14, "Tested by national health labs in Africa, against E. coli, Salmonella and cholera."],
        [30.35, 3.41, "We work with NGOs, governments and investors, worldwide."],
        [34.21, 4.18, "Follow us for short videos on the water we drink, and why prevention matters."],
      ];
      const TIMED = LINES.map(([start, dur, text]) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        let t = start + 0.1; const span = dur - 0.25;
        return words.map((w, i) => { const d = (wts[i] / total) * span; const o = { w, t, d }; t += d; return o; });
      });
      // time the voice says `word` (nth match) in line li
      const W = (li, word, nth = 0) => {
        const m = TIMED[li].filter((x) => x.w.toLowerCase().replace(/[^\w']/g, "") === word.toLowerCase());
        return (m[nth] || m[0]).t;
      };

      function figure(id, { left, top, w, prop = "", face = "smile", cane = false }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : prop === "lens"
            ? `<g class="prop"><line x1="144" y1="210" x2="160" y2="186" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><circle cx="176" cy="160" r="30" fill="${SKY}" fill-opacity="0.7" stroke="${INK}" stroke-width="8"/></g>`
            : cane
            ? `<g class="prop"><path d="M144 210 L150 340 M144 210 q-6 -16 8 -18" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
            <g class="f-sick" opacity="${show("sick")}"><path d="M76 70 L92 80 M92 70 L76 80 M108 70 L124 80 M124 70 L108 80" stroke-width="6"/><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry", "sick"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
        if (face === "sick") tl.set(`#${id} .eyes`, { opacity: 0 }, t); else tl.set(`#${id} .eyes`, { opacity: 1 }, t);
      }
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }
      // germs
      const bacterium = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><rect x="-26" y="-13" width="52" height="26" rx="13" fill="#fff" stroke="${INK}" stroke-width="4.5"/><circle cx="-8" cy="-2" r="3" fill="${INK}"/><circle cx="8" cy="3" r="3" fill="${BLUE}"/><path d="M26 0 q7 -7 14 0 t12 0 M-26 0 q-7 7 -14 0 t-12 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>`;
      const virus = (x, y, s, cls = "") => {
        let sp = "";
        for (let a = 0; a < 360; a += 45) { const r = (a * Math.PI) / 180; sp += `<line x1="${Math.cos(r) * 18}" y1="${Math.sin(r) * 18}" x2="${Math.cos(r) * 28}" y2="${Math.sin(r) * 28}"/><circle cx="${Math.cos(r) * 30}" cy="${Math.sin(r) * 30}" r="4" fill="${BLUE}"/>`; }
        return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig" stroke="${INK}" stroke-width="4">${sp}<circle r="18" fill="#fff"/><circle cx="-5" cy="-3" r="3" fill="${INK}" stroke="none"/><circle cx="6" cy="-3" r="3" fill="${INK}" stroke="none"/></g></g>`;
      };
      const parasite = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="40" cy="-2" r="3" fill="${INK}"/></g></g>`;
      const dropPath = (x, y, s, fill, cls, stroke = INK) =>
        `<g transform="translate(${x} ${y})"><path class="${cls}" transform="scale(${s})" d="M0 -18 C-5 -8 -11 -2 -11 5 a11 11 0 0 0 22 0 C11 -2 5 -8 0 -18 Z" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/></g>`;

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, extra = {}) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", ...extra }, t);
      const wiggle = (sel, t, dur) => tl.fromTo(sel, { rotation: -12 }, { rotation: 12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 0.25)), svgOrigin: "0 0" }, t);
      const shake = (sel, t, n = 5, a = 1) => tl.fromTo(sel, { rotation: 0 }, { rotation: a, duration: 0.05, yoyo: true, repeat: n, ease: "none" }, t);


      const TX = {"tag": "ABOUT US · <b>AQUACORE</b>", "title": "About AquaCore", "locale": "en-US"};
      const T = [0, 3.82, 12.53, 18.59, 24.76, 30.35, 34.21, 38.89, 41.39];
      const RED = "#d64545";
      const at = (li, f) => LINES[li][0] + LINES[li][1] * f;
      const iAqua = `<g stroke="${INK}" stroke-width="9" fill="none" stroke-linejoin="round"><path d="M80 14 C80 14 38 66 38 96 a42 42 0 0 0 84 0 C122 66 80 14 80 14 Z"/></g><circle cx="80" cy="96" r="18" fill="${BLUE}"/>`;
      const iClock = `<circle cx="80" cy="80" r="64" fill="#fff" stroke="${INK}" stroke-width="9"/><circle cx="80" cy="80" r="7" fill="${INK}"/>`;
      const iFlask = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><path d="M60 14 L100 14 M66 14 L66 64 L22 142 L138 142 L94 64 L94 14"/></g><path d="M42 108 L118 108 L132 138 L28 138 Z" fill="${SKY}"/>`;
      const iRiver = `<path d="M10 120 Q50 100 80 120 T150 120 L150 150 L10 150 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="7"/><path d="M20 90 L50 50 L80 90 Z M70 90 L105 40 L140 90 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>`;
      const iWell = `<g stroke="${INK}" stroke-width="7" fill="#fff" stroke-linejoin="round"><rect x="30" y="90" width="100" height="56"/><path d="M40 90 L40 40 M120 90 L120 40 M24 40 L136 40"/><path d="M80 40 L80 70"/><rect x="68" y="70" width="24" height="18" fill="${SKY}"/></g>`;
      const iRain = `<g stroke="${INK}" stroke-width="7" fill="#fff" stroke-linejoin="round"><path d="M40 90 a26 26 0 0 1 8 -50 a36 36 0 0 1 68 -6 a30 30 0 0 1 24 56 Z"/></g><g stroke="${BLUE}" stroke-width="7" stroke-linecap="round"><line x1="56" y1="108" x2="46" y2="134"/><line x1="86" y1="108" x2="76" y2="134"/><line x1="116" y1="108" x2="106" y2="134"/></g>`;
      const iNgo = `<path d="M80 140 C80 140 20 106 20 64 a30 30 0 0 1 60 -10 a30 30 0 0 1 60 10 C140 106 80 140 80 140Z" fill="#fff" stroke="${INK}" stroke-width="8"/>`;
      const iGov = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M16 56 L80 22 L144 56 Z"/><path d="M14 140 H146"/></g><path d="M34 66 V126 M64 66 V126 M96 66 V126 M126 66 V126" stroke="${BLUE}" stroke-width="8"/>`;
      const iInv = `<g stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"><path d="M14 140 H146"/></g><path d="M22 116 L58 80 L82 100 L134 46 M106 46 H134 V74" stroke="${BLUE}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      const iGlobe = `<circle cx="80" cy="80" r="62" fill="${SKY}" stroke="${INK}" stroke-width="8"/><ellipse cx="80" cy="80" rx="26" ry="62" fill="none" stroke="${BLUE}" stroke-width="6"/><path d="M18 80 H142 M28 46 H132 M28 114 H132" stroke="${BLUE}" stroke-width="6" fill="none"/>`;
      const iBook = `<path d="M80 38 C64 26 38 26 18 32 V130 C38 124 64 124 80 136 C96 124 122 124 142 130 V32 C122 26 96 26 80 38 Z" fill="#fff" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/><path d="M80 38 V136" stroke="${BLUE}" stroke-width="7"/>`;
      const card = (id, left, top, w, icon, label, isz = 170, fs = 46) => `<div id="${id}" class="abs card" style="left:${left}px;top:${top}px;width:${w}px;padding:16px 10px"><svg viewBox="0 0 160 160" width="${isz}" height="${isz}">${icon}</svg><div class="label" style="font-size:${fs}px;line-height:1.05">${label}</div></div>`;
      const chipAt = (id, top, html, size = 60, bg = BLUE, rot = 0) => `<div id="${id}" class="abs" style="left:0;top:${top}px;width:1080px;text-align:center"><span class="chip" style="font-size:${size}px;background:${bg};display:inline-block;transform:rotate(${rot}deg)">${html}</span></div>`;

      /* ================= S0 · we're AquaCore ================= */
      add("s0", `<div id="lg0" class="abs" style="left:0;top:10px;width:1080px;text-align:center"><svg viewBox="0 0 160 160" width="210" height="210">${iAqua}</svg><div style="font-family:Cap;font-weight:900;font-size:104px;letter-spacing:0.04em;margin-top:-8px">AQUA<span style="color:${BLUE}">CORE</span></div></div>`);
      add("s0", glass("g0", { left: 390, top: 420, w: 300, extra: `<g id="gm0">${bacterium(60, 120, 0.7, "")}${virus(105, 160, 0.6, "")}${parasite(80, 190, 0.5, "")}</g>` }));
      add("s0", `<div id="ln0" class="abs" style="left:380px;top:470px;width:320px;height:320px"><svg viewBox="0 0 300 300" width="320" height="320"><circle cx="140" cy="140" r="115" fill="none" stroke="${INK}" stroke-width="14"/><line x1="222" y1="222" x2="290" y2="290" stroke="${INK}" stroke-width="22" stroke-linecap="round"/></svg></div>`);
      tl.set(["#g0", "#gm0", "#ln0"], { opacity: 0 }, 0);
      tl.fromTo("#lg0", { scale: 2.2, opacity: 0, transformOrigin: "50% 30%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#s0 .cam", focus(540, 200, 1.3), { ...focus(540, 480, 1.0), duration: 1.2, ease: "power2.inOut" }, at(0, 0.3));
      pop("#g0", at(0, 0.35));
      tl.fromTo("#ln0", { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, at(0, 0.6));
      tl.to("#gm0", { opacity: 1, duration: 0.15 }, at(0, 0.75));
      wiggle("#gm0 .wig", at(0, 0.75), 1.0);

      /* ================= S1 · clear but unsafe; never tested ================= */
      add("s1", glass("g1", { left: 170, top: 40, w: 260, extra: `<g id="gm1">${bacterium(60, 130, 0.6, "")}${virus(100, 175, 0.5, "")}</g>` }));
      add("s1", `<div id="cl1" class="abs" style="left:120px;top:420px;width:360px;text-align:center"><span class="chip" style="font-size:44px">CLEAR ✓</span></div>`);
      add("s1", figure("f1", { left: 620, top: 40, w: 220, face: "smile" }));
      add("s1", `<div id="sk1" class="abs" style="left:560px;top:430px;width:360px;text-align:center"><span class="chip" style="font-size:44px;background:${RED}">SICK ✗</span></div>`);
      add("s1", card("c1a", 40, 560, 310, iRiver, "rivers") + card("c1b", 385, 560, 310, iWell, "wells") + card("c1c", 730, 560, 310, iRain, "rain tanks"));
      add("s1", chipAt("nt1", 900, "NEVER TESTED OR TREATED", 54, RED, -3));
      tl.set(["#g1", "#cl1", "#f1", "#sk1", "#c1a", "#c1b", "#c1c", "#nt1", "#gm1"], { opacity: 0 }, T[1]);
      tl.fromTo("#s1 .cam", focus(540, 280, 1.25), { ...focus(540, 300, 1.2), duration: 1.4, ease: "none" }, T[1]);
      pop("#g1", T[1] + 0.05); pop("#cl1", at(1, 0.12));
      tl.to("#gm1", { opacity: 1, duration: 0.2 }, at(1, 0.2)); wiggle("#gm1 .wig", at(1, 0.2), 1.5);
      pop("#f1", at(1, 0.18)); setFace(tl, "f1", "sick", at(1, 0.28)); pop("#sk1", at(1, 0.28));
      tl.to("#s1 .cam", { ...focus(540, 560, 1.0), duration: 0.6, ease: "power2.inOut" }, at(1, 0.4));
      pop("#c1a", at(1, 0.6)); pop("#c1b", at(1, 0.68)); pop("#c1c", at(1, 0.76));
      tl.fromTo("#nt1", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, at(1, 0.86));

      /* ================= S2 · tablets + local network ================= */
      add("s2", `<div id="tb2" class="abs" style="left:0;top:20px;width:1080px;text-align:center"><svg viewBox="0 0 160 160" width="300" height="300"><path d="M18 70 V92 A62 24 0 0 0 142 92 V70" fill="${SKY}" stroke="${INK}" stroke-width="8"/><ellipse cx="80" cy="70" rx="62" ry="24" fill="#fff" stroke="${INK}" stroke-width="8"/><line x1="46" y1="70" x2="114" y2="70" stroke="${BLUE}" stroke-width="7" stroke-linecap="round"/></svg></div>`);
      add("s2", chipAt("cl2", 300, "ClO₂ · chlorine dioxide", 54));
      const house = (x) => `<g class="hs2" transform="translate(${x} 0)"><path d="M0 60 L50 20 L100 60 L100 130 L0 130 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><rect x="38" y="88" width="24" height="42" fill="${SKY}" stroke="${INK}" stroke-width="5"/></g>`;

      add("s2", `<div id="ln2" class="abs label" style="left:560px;top:600px;width:480px;opacity:0;color:${BLUE}">local network</div>`);

      add("s3", `<div id="cn3" class="abs" style="left:90px;top:300px">${can}</div>`);

      add("s3", `<div id="ck3" class="abs" style="left:560px;top:260px;width:380px;text-align:center"><svg viewBox="0 0 160 160" width="240" height="240">${iClock}<line id="hd3" x1="80" y1="80" x2="80" y2="34" stroke="${BLUE}" stroke-width="9" stroke-linecap="round"/></svg><div class="chip" style="display:inline-block;font-size:50px">30 MIN</div></div>`);
      add("s3", figure("f3", { left: 660, top: 250, w: 200, prop: "glass", face: "smile" }));
      add("s3", `<div id="rd3" class="abs" style="left:520px;top:640px;width:480px;text-align:center"><span class="chip" style="font-size:48px">READY ✓</span></div>`);
      tl.set(["#tb3", ".fz3", "#ck3", "#f3", "#rd3"], { opacity: 0 }, T[3]);
      tl.fromTo("#s3 .cam", focus(540, 540, 1.04), { ...focus(540, 540, 1.0), duration: 4, ease: "none" }, T[3]);
      const seg = (k, t) => tl.to(`#sg3_${k}`, { backgroundColor: BLUE, duration: 0.2 }, t);
      seg(0, T[3] + 0.1); tl.fromTo("#wf3", { attr: { y: 214 } }, { attr: { y: 90 }, duration: 0.9, ease: "power1.out" }, T[3] + 0.1);
      seg(1, at(3, 0.3)); tl.set("#tb3", { opacity: 1 }, at(3, 0.3)); tl.fromTo("#tb3", { y: 0 }, { y: 300, duration: 0.45, ease: "power2.in" }, at(3, 0.3)); tl.to("#tb3", { opacity: 0, duration: 0.1 }, at(3, 0.3) + 0.45);
      tl.fromTo(".fz3", { y: 0, opacity: 0 }, { y: -110, opacity: 1, duration: 0.5, stagger: { each: 0.08, repeat: 3 } }, at(3, 0.3) + 0.45);
      seg(2, at(3, 0.5)); pop("#ck3", at(3, 0.5)); tl.fromTo("#hd3", { rotation: 0 }, { rotation: 360, svgOrigin: "80 80", duration: 1.0, ease: "none" }, at(3, 0.52));
      seg(3, at(3, 0.75)); tl.to("#ck3", { opacity: 0, scale: 0.6, duration: 0.2 }, at(3, 0.72)); pop("#f3", at(3, 0.75)); pop("#rd3", at(3, 0.82));

      /* ================= S4 · lab tested ================= */
      add("s4", chipAt("nl4", 20, "NATIONAL HEALTH LABS ✓", 56));
      const lab = (id, left, c, l) => `<div id="${id}" class="abs card" style="left:${left}px;top:150px;width:440px;padding:18px 10px"><svg viewBox="0 0 160 160" width="120" height="120">${iFlask}</svg><div style="font-family:Cap;font-weight:900;font-size:50px">${c}</div><div class="small" style="font-size:34px;color:${MUTED}">${l}</div></div>`;
      add("s4", lab("lb4a", 60, "CAMEROON", "Centre Pasteur · 2012") + lab("lb4b", 580, "NIGER", "LANSPEX · 2017"));
      const vib = `<g><path d="M-30 10 C-30 -20 10 -30 30 -10" stroke="${INK}" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M-30 10 C-30 -20 10 -30 30 -10" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></g>`;
      const gc = (id, left, art, name) => `<div id="${id}" class="abs" style="left:${left}px;top:560px;width:300px;text-align:center"><svg viewBox="-60 -50 120 100" width="220" height="180">${art}<g class="gx4" stroke="${BLUE}" stroke-width="10" stroke-linecap="round"><line x1="-45" y1="-40" x2="45" y2="40"/><line x1="45" y1="-40" x2="-45" y2="40"/></g></svg><div class="label" style="font-size:52px">${name}</div></div>`;
      add("s4", gc("g4a", 50, bacterium(0, 0, 1.4, ""), "E. coli") + gc("g4b", 390, bacterium(0, 0, 1.2, "").replace(/#1e7fd8/g, DIRT), "Salmonella") + gc("g4c", 730, vib, "cholera"));
      tl.set(["#nl4", "#lb4a", "#lb4b", "#g4a", "#g4b", "#g4c", ".gx4"], { opacity: 0 }, T[4]);
      tl.fromTo("#s4 .cam", focus(540, 480, 1.05), { ...focus(540, 500, 1.0), duration: 3, ease: "none" }, T[4]);
      pop("#nl4", T[4] + 0.05); pop("#lb4a", at(4, 0.15)); pop("#lb4b", at(4, 0.3));
      [["#g4a", 0.6], ["#g4b", 0.72], ["#g4c", 0.86]].forEach(([g, f]) => { pop(g, at(4, f) - 0.15); tl.fromTo(`${g} .gx4`, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, svgOrigin: "0 0", duration: 0.2, ease: "back.out(3)" }, at(4, f) + 0.1); });

      /* ================= S5 · who we work with ================= */
      add("s5", card("c5a", 40, 40, 310, iNgo, "NGOs") + card("c5b", 385, 40, 310, iGov, "governments") + card("c5c", 730, 40, 310, iInv, "investors"));
      add("s5", `<div id="gl5" class="abs" style="left:0;top:420px;width:1080px;text-align:center"><svg viewBox="0 0 160 160" width="330" height="330">${iGlobe}</svg></div>` + chipAt("ww5", 790, "WORLDWIDE", 70));
      tl.set(["#c5a", "#c5b", "#c5c", "#gl5", "#ww5"], { opacity: 0 }, T[5]);
      pop("#c5a", at(5, 0.15)); pop("#c5b", at(5, 0.3)); pop("#c5c", at(5, 0.55));
      pop("#gl5", at(5, 0.7)); tl.fromTo("#gl5 svg", { rotation: -20 }, { rotation: 20, duration: 1.5, ease: "sine.inOut", transformOrigin: "50% 50%" }, at(5, 0.7)); pop("#ww5", at(5, 0.8));

      /* ================= S6 · follow ================= */
      add("s6", `<div id="bk6" class="abs" style="left:0;top:40px;width:1080px;text-align:center"><svg viewBox="0 0 160 160" width="300" height="300">${iBook}</svg></div>`);
      add("s6", `<div id="pv6" class="abs label" style="left:40px;top:380px;width:1000px;font-size:64px">the water we drink · why <span style="color:${BLUE}">prevention</span> matters</div>`);
      add("s6", chipAt("fw6", 620, "FOLLOW FOR MORE", 90, BLUE, -2) + `<div id="hd6" class="abs" style="left:0;top:800px;width:1080px;text-align:center;font-family:Cap;font-weight:900;font-size:60px">@aquacoreglobal</div>`);
      tl.set(["#bk6", "#pv6", "#fw6", "#hd6"], { opacity: 0 }, T[6]);
      pop("#bk6", T[6] + 0.05); pop("#pv6", at(6, 0.3)); pop("#fw6", at(6, 0.05) + 0.1, { rotation: -2 }); pop("#hd6", at(6, 0.5));

      /* ================= S7 · end card ================= */
      add("s7", `<div class="abs" style="left:0;top:120px;width:1080px;text-align:center"><img id="logo" src="assets/logo.png" style="width:420px;height:420px" /><div id="e2" style="font-family:Cap;font-weight:900;font-size:60px;margin-top:20px">aquacoreglobal.com</div></div>`);
      pop("#logo", T[7] + 0.05);
      tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, T[7] + 0.3);

      /* ================= captions ================= */
      const KEY = /^(aquacore|safe|see|clear|sick|millions|rivers|wells|rain|never|tested|simple|chlorine|dioxide|tablets|network|litre|tablet|thirty|minutes|ready|labs|coli|salmonella|cholera|ngos|governments|investors|worldwide|follow|prevention)$/i;
      const capsEl = document.getElementById("caps");
      TIMED.forEach((words, li) => {
        let chunk = [], chunks = [];
        words.forEach((x, i) => {
          chunk.push(x);
          const len = chunk.map((c) => c.w).join(" ").length;
          if (/[,.?!:]$/.test(x.w) || chunk.length >= 4 || len > 18 || i === words.length - 1) { chunks.push(chunk); chunk = []; }
        });
        chunks.forEach((c, ci) => {
          const id = `c${li}_${ci}`;
          capsEl.insertAdjacentHTML("beforeend", `<div id="${id}" class="cap">${c.map((x, wi) => `<span id="${id}_${wi}"${KEY.test(x.w.replace(/[^\w]/g, "")) ? ' class="k"' : ""}>${x.w}</span>`).join(" ")}</div>`);
          const cs = c[0].t, ce = ci < chunks.length - 1 ? chunks[ci + 1][0].t : c[c.length - 1].t + c[c.length - 1].d + 0.15;
          tl.fromTo(`#${id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08 }, cs);
          tl.set(`#${id}`, { opacity: 0 }, ce);
          c.forEach((x, wi) => tl.fromTo(`#${id}_${wi}`, { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, x.t));
        });
      });

      if (document.documentElement.dataset.format === "landscape") {
        tl.fromTo("#stage", { scale: 0.92, x: 0, transformOrigin: "0 0" }, { scale: 0.92, x: 0, duration: 0.01 }, 0);
        tl.to("#stage", { x: 393, duration: 0.5, ease: "power2.inOut" }, 38.89);
      }
      tl.set({}, {}, 41.39);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
