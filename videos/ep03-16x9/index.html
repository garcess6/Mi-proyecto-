<!doctype html>
<html lang="en" data-resolution="landscape" data-format="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Clear Is Not Safe</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hand"; src: url("assets/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Cap"; src: url("assets/fonts/nunito-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ground: #ffffff; --ink: #111418; --blue: #1e7fd8; --sky: #dff2fc; --muted: #8b96a3; --W: 1080px; --H: 1920px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); font-family: "Hand", sans-serif; color: var(--ink); overflow: hidden; }
      #stage { position: absolute; width: 1080px; height: 1080px; left: 0; top: 300px; transform-origin: 0 0; overflow: hidden; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1420px; height: 260px; }
      #tag { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; }
      html[data-format="landscape"] { --W: 1920px; --H: 1080px; }
      html[data-format="landscape"] #stage { left: 70px; top: 43px; }
      html[data-format="landscape"] #caps { left: 1120px; width: 740px; top: 360px; height: 420px; }
      html[data-format="landscape"] #tag { left: 1120px; width: 740px; top: 150px; }
      html[data-format="landscape"] .cap { font-size: 84px; }
      html[data-format="landscape"] .pill { font-size: 28px; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; transform-origin: 0 0; }
      .abs { position: absolute; }
      svg { overflow: visible; }
      .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 14px; padding: 10px 28px; border: 5px solid var(--ink); border-radius: 999px; font-family: "Cap"; font-weight: 900; font-size: 34px; letter-spacing: 0.04em; background: #fff; }
      .pill b { color: var(--blue); }
      .label { font-family: "Hand"; font-size: 66px; line-height: 1; text-align: center; }
      .small { font-family: "Hand"; font-size: 48px; line-height: 1; text-align: center; }
      .chip { font-family: "Cap"; font-weight: 900; font-size: 52px; letter-spacing: 0.06em; padding: 8px 30px; border-radius: 18px; background: var(--blue); color: #fff; border: 5px solid var(--ink); }
      .card { background: #fff; border: 8px solid var(--ink); border-radius: 28px; text-align: center; }
      .cap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Cap"; font-weight: 900; font-size: 76px; line-height: 1.12; color: var(--ink); opacity: 0; }
      .cap span { display: inline-block; margin: 0 0.06em; }
      .cap span.k { color: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.7" data-width="1920" data-height="1080">
      <audio id="vo" class="clip" src="assets/voice.wav" data-start="0" data-duration="42.7" data-track-index="9"></audio>
      <div id="tag" class="clip" data-start="0" data-duration="39.7" data-track-index="8">
        <div class="pill">EP. 3 · <b>WATER:</b> WHAT WE DON'T SEE</div>
      </div>
      <div id="stage">
        <div id="s0" class="scene clip" data-start="0" data-duration="3.9" data-track-index="1"><div class="cam"></div></div>
        <div id="s1" class="scene clip" data-start="3.9" data-duration="6" data-track-index="1"><div class="cam"></div></div>
        <div id="s2" class="scene clip" data-start="9.9" data-duration="5.3" data-track-index="1"><div class="cam"></div></div>
        <div id="s3" class="scene clip" data-start="15.2" data-duration="6.9" data-track-index="1"><div class="cam"></div></div>
        <div id="s4" class="scene clip" data-start="22.1" data-duration="8.7" data-track-index="1"><div class="cam"></div></div>
        <div id="s5" class="scene clip" data-start="30.8" data-duration="4" data-track-index="1"><div class="cam"></div></div>
        <div id="s6" class="scene clip" data-start="34.8" data-duration="4.9" data-track-index="1"><div class="cam"></div></div>
        <div id="s7" class="scene clip" data-start="39.7" data-duration="3" data-track-index="1"><div class="cam"></div></div>
      </div>
      <div id="caps"></div>
    </div>

    <script>
      /* ================= helpers ================= */
      const INK = "#111418", BLUE = "#1e7fd8", SKY = "#dff2fc", MUTED = "#8b96a3", DIRT = "#8a7660", GRAY = "#4a4f57";
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const cam = (id) => document.getElementById(id).getElementsByClassName("cam")[0];
      const add = (id, html) => cam(id).insertAdjacentHTML("beforeend", html);
      const addTop = (id, html) => document.getElementById(id).insertAdjacentHTML("beforeend", html);
      const focus = (px, py, s) => ({ x: 540 - px * s, y: 540 - py * s, scale: s });

      /* voice lines: [start, duration, text]; word times are estimated from these */
      const LINES = [
        [0.4, 3.18, "Germs are tiny. Hundreds could line up across a pinhead."],
        [3.9, 5.7, "So clear water can still carry them. And cloudy water can hide germs, and make treatment work less well."],
        [9.9, 4.99, "Your eyes, nose and taste can't tell you if water is safe. So how do you spot the risk?"],
        [15.2, 6.57, "Look for warning signs: toilets or animals near the source, open tanks, cracked pipes, floods or heavy rain."],
        [22.1, 8.41, "Then test it. A lab or a field kit can detect E. coli, a sign of faecal contamination, and chemicals like nitrates or arsenic."],
        [30.8, 3.69, "Test again over time: water quality can change with the seasons."],
        [34.8, 4.76, "Next episode: boiling, filters, chlorine, tablets. What does each one really do?"],
      ];
      const TIMED = LINES.map(([start, dur, text]) => {
        const words = text.split(" ");
        const wts = words.map((w) => w.replace(/[^\w']/g, "").length + 3 + (/[.?!…]$/.test(w) ? 7 : /[,:]$/.test(w) ? 4 : 0));
        const total = wts.reduce((a, b) => a + b, 0);
        let t = start + 0.1; const span = dur - 0.25;
        return words.map((w, i) => { const d = (wts[i] / total) * span; const o = { w, t, d }; t += d; return o; });
      });
      // time the voice says `word` (nth match) in line li
      const W = (li, word, nth = 0) => {
        const m = TIMED[li].filter((x) => x.w.toLowerCase().replace(/[^\w']/g, "") === word.toLowerCase());
        return (m[nth] || m[0]).t;
      };

      function figure(id, { left, top, w, prop = "", face = "smile", cane = false }) {
        const h = w * 1.8;
        const propSvg =
          prop === "glass"
            ? `<g class="prop"><path d="M136 188 L172 188 L167 236 L141 236 Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M139 204 L169 204 L167 236 L141 236 Z" fill="${SKY}" stroke="none"/><path d="M139 204 Q154 198 169 204" stroke="${BLUE}" stroke-width="5" fill="none"/></g>`
            : prop === "lens"
            ? `<g class="prop"><line x1="144" y1="210" x2="160" y2="186" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><circle cx="176" cy="160" r="30" fill="${SKY}" fill-opacity="0.7" stroke="${INK}" stroke-width="8"/></g>`
            : cane
            ? `<g class="prop"><path d="M144 210 L150 340 M144 210 q-6 -16 8 -18" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`
            : "";
        const show = (n) => (n === face ? 1 : 0);
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 200 360" width="${w}" height="${h}">
          <g fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path class="hdrop" d="M100 0 C94 12 86 20 86 28 a14 14 0 0 0 28 0 C114 20 106 12 100 0 Z" fill="${BLUE}" stroke-width="5"/>
            <line x1="100" y1="126" x2="100" y2="240"/>
            <line x1="100" y1="240" x2="66" y2="340"/><line x1="100" y1="240" x2="134" y2="340"/>
            <g class="armL"><line x1="100" y1="150" x2="56" y2="210"/></g>
            <g class="armR"><line x1="100" y1="150" x2="144" y2="210"/>${propSvg}</g>
            <circle cx="100" cy="80" r="46" fill="#fff"/>
            <g class="eyes" stroke="none" fill="${INK}"><circle cx="84" cy="76" r="6.5"/><circle cx="116" cy="76" r="6.5"/></g>
            <g class="f-smile" opacity="${show("smile")}"><path d="M84 98 Q100 114 116 98"/></g>
            <g class="f-o" opacity="${show("o")}"><circle cx="100" cy="104" r="9"/><path d="M72 58 L92 52 M108 52 L128 58" stroke-width="6"/></g>
            <g class="f-hmm" opacity="${show("hmm")}"><path d="M88 106 L114 100"/><path d="M74 60 L92 58 M108 54 L126 50" stroke-width="6"/></g>
            <g class="f-worry" opacity="${show("worry")}"><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/><path d="M74 56 L92 63 M108 63 L126 56" stroke-width="6"/><path class="sweat" d="M146 54 C142 62 138 66 138 71 a8 8 0 0 0 16 0 C154 66 150 62 146 54 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="4"/></g>
            <g class="f-sick" opacity="${show("sick")}"><path d="M76 70 L92 80 M92 70 L76 80 M108 70 L124 80 M124 70 L108 80" stroke-width="6"/><path d="M84 108 Q92 99 100 105 Q108 111 116 102"/></g>
          </g>
        </svg></div>`;
      }
      function setFace(tl, id, face, t) {
        ["smile", "o", "hmm", "worry", "sick"].forEach((f) => tl.set(`#${id} .f-${f}`, { opacity: f === face ? 1 : 0 }, t));
        if (face === "sick") tl.set(`#${id} .eyes`, { opacity: 0 }, t); else tl.set(`#${id} .eyes`, { opacity: 1 }, t);
      }
      function glass(id, { left, top, w, extra = "" }) {
        const h = w * 1.375;
        return `<div id="${id}" class="abs" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">
        <svg viewBox="0 0 160 220" width="${w}" height="${h}">
          <path d="M26 66 L134 66 L124 206 L36 206 Z" fill="${SKY}"/>
          <path class="wave" d="M26 66 Q53 56 80 66 T134 66" stroke="${BLUE}" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="inside">${extra}</g>
          <path d="M18 10 L142 10 L126 210 L34 210 Z" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>
          <path d="M40 28 L50 190" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        </svg></div>`;
      }
      // germs
      const bacterium = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><rect x="-26" y="-13" width="52" height="26" rx="13" fill="#fff" stroke="${INK}" stroke-width="4.5"/><circle cx="-8" cy="-2" r="3" fill="${INK}"/><circle cx="8" cy="3" r="3" fill="${BLUE}"/><path d="M26 0 q7 -7 14 0 t12 0 M-26 0 q-7 7 -14 0 t-12 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>`;
      const virus = (x, y, s, cls = "") => {
        let sp = "";
        for (let a = 0; a < 360; a += 45) { const r = (a * Math.PI) / 180; sp += `<line x1="${Math.cos(r) * 18}" y1="${Math.sin(r) * 18}" x2="${Math.cos(r) * 28}" y2="${Math.sin(r) * 28}"/><circle cx="${Math.cos(r) * 30}" cy="${Math.sin(r) * 30}" r="4" fill="${BLUE}"/>`; }
        return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig" stroke="${INK}" stroke-width="4">${sp}<circle r="18" fill="#fff"/><circle cx="-5" cy="-3" r="3" fill="${INK}" stroke="none"/><circle cx="6" cy="-3" r="3" fill="${INK}" stroke="none"/></g></g>`;
      };
      const parasite = (x, y, s, cls = "") =>
        `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><g class="wig"><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M-40 0 C-30 -18 -15 18 0 0 C15 -18 30 18 40 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="40" cy="-2" r="3" fill="${INK}"/></g></g>`;
      const dropPath = (x, y, s, fill, cls, stroke = INK) =>
        `<g transform="translate(${x} ${y})"><path class="${cls}" transform="scale(${s})" d="M0 -18 C-5 -8 -11 -2 -11 5 a11 11 0 0 0 22 0 C11 -2 5 -8 0 -18 Z" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/></g>`;

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t, extra = {}) => tl.fromTo(sel, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)", ...extra }, t);
      const wiggle = (sel, t, dur) => tl.fromTo(sel, { rotation: -12 }, { rotation: 12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 0.25)), svgOrigin: "0 0" }, t);
      const shake = (sel, t, n = 5, a = 1) => tl.fromTo(sel, { rotation: 0 }, { rotation: a, duration: 0.05, yoyo: true, repeat: n, ease: "none" }, t);

      /* ================= S0 · germs are tiny (0 – 3.9) ================= */
      let row = "";
      for (let i = 0; i < 11; i++) row += bacterium(410 + i * 26, 330, 0.28, "rowb");
      add("s0", `<svg class="abs" style="left:0;top:0" width="1080" height="1080" viewBox="0 0 1080 1080">
        <line x1="540" y1="480" x2="540" y2="1100" stroke="${INK}" stroke-width="18" stroke-linecap="round"/>
        <path d="M540 1100 L530 1060 L550 1060 Z" fill="${INK}"/>
        <circle id="pinhead" cx="540" cy="330" r="160" fill="${BLUE}" stroke="${INK}" stroke-width="12"/>
        <path d="M470 250 Q500 215 545 210" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>
        <circle cx="540" cy="330" r="150" fill="#fff" opacity="0" id="pinface"/>
        ${row}
      </svg>`);
      add("s0", `<svg id="bigb" class="abs" style="left:0;top:0" width="1080" height="1080" viewBox="0 0 1080 1080">${bacterium(540, 330, 5, "")}</svg>`);
      tl.set(".rowb", { opacity: 0 }, 0);
      tl.fromTo("#s0 .cam", focus(540, 540, 1.0), { ...focus(540, 500, 1.05), duration: 1.6, ease: "none" }, 0);
      pop("#bigb", 0.2);
      wiggle("#bigb .wig", 0.3, 1.2);
      tl.to("#bigb", { scale: 0.06, transformOrigin: "50% 30.5%", duration: 0.6, ease: "power2.in" }, W(0, "tiny") + 0.1);
      tl.to("#bigb", { opacity: 0, duration: 0.1 }, W(0, "tiny") + 0.7);
      tl.to("#s0 .cam", { ...focus(540, 330, 2.6), duration: 0.9, ease: "power3.inOut" }, W(0, "hundreds") - 0.1);
      tl.to("#pinface", { opacity: 0.85, duration: 0.3 }, W(0, "line"));
      tl.to(".rowb", { opacity: 1, duration: 0.05, stagger: 0.06 }, W(0, "line"));
      wiggle(".rowb .wig", W(0, "line") + 0.3, 1.2);

      /* ================= S1 · clear vs cloudy (3.9 – 9.9) ================= */
      let murk = "";
      for (let i = 0; i < 16; i++) murk += `<circle cx="${40 + rnd() * 80}" cy="${80 + rnd() * 115}" r="${3 + rnd() * 5}" fill="${DIRT}"/>`;
      add("s1", glass("ca", { left: 140, top: 160, w: 300, extra: `<g class="gin">${bacterium(60, 120, 0.7, "")}${virus(100, 165, 0.6, "")}${bacterium(85, 190, 0.5, "")}</g>` }));
      add("s1", glass("cb", { left: 640, top: 160, w: 300, extra: `<path d="M28 68 L132 68 L124 206 L36 206 Z" fill="${DIRT}" opacity="0.35"/>${murk}` }));
      add("s1", `<div id="lc" class="abs label" style="left:140px;top:600px;width:300px">clear</div><div id="lk" class="abs label" style="left:640px;top:600px;width:300px">cloudy</div>`);
      add("s1", `<div id="lens1" class="abs" style="left:150px;top:230px;width:280px;height:280px;opacity:0"><svg viewBox="0 0 300 300" width="280" height="280"><circle cx="140" cy="140" r="115" fill="none" stroke="${INK}" stroke-width="14"/><line x1="222" y1="222" x2="290" y2="290" stroke="${INK}" stroke-width="22" stroke-linecap="round"/></svg></div>`);
      // zoomed view inside the cloudy glass: a dirt clump shields a germ from treatment
      let sparks = "";
      for (let i = 0; i < 6; i++) sparks += `<g class="spk"><g transform="translate(${400 + i * 55} 80)"><path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="${BLUE}" stroke="${INK}" stroke-width="3"/></g></g>`;
      addTop("s1", `<div id="zoomc" class="abs" style="left:0;top:0;width:1080px;height:1080px;opacity:0;background:#fff">
        <svg viewBox="0 0 1080 1080" width="1080" height="1080">
          <circle cx="540" cy="540" r="420" fill="#efe9e2" stroke="${INK}" stroke-width="14"/>
          <g class="hid">${bacterium(560, 520, 2.6, "")}</g>
          <path id="clump" d="M380 470 C360 400 450 370 500 400 C540 360 640 380 650 440 C720 450 720 540 660 560 C640 610 540 620 500 590 C440 620 370 580 380 520 Z" fill="${DIRT}" stroke="${INK}" stroke-width="10"/>
          ${sparks}
          <g id="tlabel"><rect x="250" y="40" width="0" height="0"/></g>
        </svg>
        <div class="abs small" style="left:0;top:960px;width:1080px;color:${BLUE}">treatment ✦</div>
      </div>`);
      tl.set("#ca .gin", { opacity: 0 }, 3.9);
      tl.fromTo("#s1 .cam", focus(540, 400, 1.2), { ...focus(540, 400, 1.0), duration: 1.0, ease: "power2.out" }, 3.9);
      pop("#ca", 3.95); pop("#lc", 4.1);
      tl.fromTo("#lens1", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, W(1, "still") - 0.2);
      tl.set("#ca .gin", { opacity: 1 }, W(1, "still") + 0.2);
      wiggle("#ca .wig", W(1, "still") + 0.2, 1.5);
      pop("#cb", W(1, "cloudy") - 0.3); pop("#lk", W(1, "cloudy"));
      tl.to("#lens1", { opacity: 0, duration: 0.2 }, W(1, "cloudy"));
      tl.to("#s1 .cam", { ...focus(790, 400, 1.6), duration: 0.5, ease: "power2.inOut" }, W(1, "hide") - 0.3);
      tl.to("#zoomc", { opacity: 1, duration: 0.25 }, W(1, "germs", 0) + 0.1 > W(1, "hide") ? W(1, "hide") + 0.1 : W(1, "hide") + 0.1);
      tl.fromTo(".hid", { x: 0 }, { x: 170, duration: 0.5, ease: "back.out(1.6)" }, W(1, "treatment") + 0.9);
      wiggle(".hid .wig", W(1, "hide") + 0.3, 2.2);
      $$(".spk").forEach((s, i) => {
        const t = W(1, "treatment") - 0.1 + i * 0.12;
        tl.fromTo(s, { y: 0, opacity: 0 }, { y: 330 + (i % 2) * 20, opacity: 1, duration: 0.45, ease: "power1.in" }, t);
        tl.to(s, { y: 200, x: (i % 2 ? 80 : -80), opacity: 0, duration: 0.4, ease: "power1.out" }, t + 0.45);
      });
      shake("#clump", W(1, "treatment") + 0.4, 5, 2);

      /* ================= S2 · senses can't tell (9.9 – 15.2) ================= */
      const sense = (id, left, icon, word) =>
        `<div id="${id}" class="abs" style="left:${left}px;top:90px;width:300px;text-align:center"><svg viewBox="0 0 160 160" width="190" height="190">${icon}<g class="nx" stroke="${BLUE}" stroke-width="14" stroke-linecap="round"><line x1="20" y1="20" x2="140" y2="140"/><line x1="140" y1="20" x2="20" y2="140"/></g></svg><div class="small">${word}</div></div>`;
      const iEye = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M10 80 Q80 10 150 80 Q80 150 10 80 Z"/><circle cx="80" cy="80" r="26" fill="${BLUE}"/><circle cx="80" cy="80" r="10" fill="${INK}" stroke="none"/></g>`;
      const iNose = `<g stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M80 20 C70 60 50 90 54 110 C58 128 90 128 104 118"/><path d="M110 60 q16 -8 30 0 M110 82 q16 -8 30 0" stroke="${MUTED}"/></g>`;
      const iTongue = `<g stroke="${INK}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M20 60 Q80 100 140 60" fill="none"/><path d="M50 74 L50 110 a30 30 0 0 0 60 0 L110 74" fill="${SKY}"/><line x1="80" y1="84" x2="80" y2="118" stroke="${BLUE}"/></g>`;
      add("s2", sense("se1", 40, iEye, "eyes") + sense("se2", 390, iNose, "nose") + sense("se3", 740, iTongue, "taste"));
      add("s2", glass("g2", { left: 200, top: 480, w: 220 }));
      add("s2", `<div id="q2" class="abs label" style="left:420px;top:470px;font-size:170px;color:${BLUE}">?</div>`);
      add("s2", figure("f2", { left: 650, top: 460, w: 230, prop: "lens", face: "hmm" }));
      tl.set("#s2 .nx", { opacity: 0 }, 9.9);
      tl.fromTo("#s2 .cam", focus(540, 220, 1.25), { ...focus(540, 240, 1.15), duration: 2.0, ease: "none" }, 9.9);
      [["#se1", "eyes"], ["#se2", "nose"], ["#se3", "taste"]].forEach(([n, w]) => {
        pop(n, W(2, w) - 0.2);
        tl.fromTo(`${n} .nx`, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, svgOrigin: "80 80", duration: 0.2, ease: "back.out(3)" }, W(2, "tell"));
      });
      tl.to("#s2 .cam", { ...focus(540, 600, 1.0), duration: 0.6, ease: "power2.inOut" }, W(2, "safe") - 0.4);
      pop("#g2", W(2, "safe") - 0.3); pop("#q2", W(2, "safe"), { rotation: 10 });
      tl.set("#f2", { opacity: 0 }, 9.9);

      /* ================= S3 · warning signs (15.2 – 22.1) ================= */

      const vFlood = `<g stroke="${INK}" stroke-width="7" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><path d="M50 90 L100 50 L150 90"/><rect x="62" y="88" width="76" height="70"/></g><path d="M0 130 Q25 115 50 130 T100 130 T150 130 T200 130 L200 190 L0 190 Z" fill="${SKY}" stroke="${BLUE}" stroke-width="7"/>`;

      addTop("s3", `<div id="bigwarn" class="abs" style="left:340px;top:300px;width:400px;height:400px;opacity:0"><svg viewBox="-50 -50 100 100" width="400" height="400"><g transform="scale(1.3)">${warn}</g></svg></div>`);

      pop("#bigwarn", 15.3);

      });
      tl.to("#s3 .cam", { ...focus(540, 540, 1.0), duration: 0.6, ease: "power2.inOut" }, W(3, "open") - 0.5);
      tl.to("#s3 .cam", { ...focus(540, 540, 1.0), duration: 2.0, ease: "none" }, W(3, "floods"));

      /* ================= S4 · test it (22.1 – 30.8) ================= */
      const tube = `<svg viewBox="0 0 120 300" width="160" height="400"><g fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"><path d="M20 20 L100 20 M34 20 L34 250 a26 26 0 0 0 52 0 L86 20"/></g><path d="M38 150 L82 150 L82 250 a22 22 0 0 1 -44 0 Z" fill="${SKY}"/><path d="M38 150 L82 150" stroke="${BLUE}" stroke-width="8"/></svg>`;
      add("s4", `<div id="tube" class="abs" style="left:460px;top:120px">${tube}</div>`);
      add("s4", `<div id="test" class="abs" style="left:0;top:600px;width:1080px;text-align:center;opacity:0"><span class="chip" style="font-size:80px">TEST IT</span></div>`);
      const flask = `<svg viewBox="0 0 160 180" width="200" height="225"><g stroke="${INK}" stroke-width="9" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><path d="M60 14 L100 14 M66 14 L66 70 L20 160 L140 160 L94 70 L94 14"/></g><path d="M40 122 L120 122 L136 156 L24 156 Z" fill="${SKY}"/></svg>`;
      const kit = `<svg viewBox="0 0 200 160" width="250" height="200"><g stroke="${INK}" stroke-width="9" fill="#fff" stroke-linejoin="round"><rect x="10" y="40" width="180" height="110" rx="14"/><path d="M70 40 L70 22 L130 22 L130 40" fill="none"/><line x1="10" y1="80" x2="190" y2="80"/></g><rect x="40" y="94" width="20" height="44" rx="6" fill="${SKY}" stroke="${INK}" stroke-width="5"/><rect x="74" y="94" width="20" height="44" rx="6" fill="${SKY}" stroke="${INK}" stroke-width="5"/><rect x="108" y="94" width="60" height="20" fill="${BLUE}" stroke="${INK}" stroke-width="5"/></svg>`;
      add("s4", `<div id="lab" class="abs" style="left:110px;top:120px;text-align:center;opacity:0">${flask}<div class="small">lab</div></div><div id="kit" class="abs" style="left:660px;top:140px;text-align:center;opacity:0">${kit}<div class="small">field kit</div></div>`);
      let colonies = "";
      for (let i = 0; i < 14; i++) colonies += `<circle class="col" cx="${-70 + rnd() * 140}" cy="${-40 + rnd() * 80}" r="${5 + rnd() * 6}" fill="${BLUE}" stroke="${INK}" stroke-width="3"/>`;
      add("s4", `<div id="dish" class="abs" style="left:110px;top:520px;width:380px;text-align:center;opacity:0"><svg viewBox="-120 -80 240 160" width="340" height="226"><ellipse rx="110" ry="70" fill="#fff" stroke="${INK}" stroke-width="9"/><ellipse rx="92" ry="56" fill="${SKY}" stroke="${INK}" stroke-width="4"/>${colonies}</svg><div class="label" style="font-size:60px">E. coli</div><div class="small" style="font-size:38px;color:${MUTED}">faecal contamination</div></div>`);
      const strip = `<svg viewBox="0 0 120 320" width="110" height="300"><rect x="30" y="10" width="60" height="300" rx="10" fill="#fff" stroke="${INK}" stroke-width="8"/><rect id="pad1" x="40" y="40" width="40" height="40" fill="#fff" stroke="${INK}" stroke-width="5"/><rect id="pad2" x="40" y="110" width="40" height="40" fill="#fff" stroke="${INK}" stroke-width="5"/></svg>`;
      add("s4", `<div id="chem" class="abs" style="left:640px;top:500px;width:340px;height:420px;opacity:0">${strip}<div class="abs" style="left:130px;top:40px;font-family:Cap;font-weight:900;font-size:54px">NO<sub style="font-size:32px">3</sub></div><div class="abs" style="left:130px;top:112px;font-family:Cap;font-weight:900;font-size:54px">As</div><div class="abs small" style="left:120px;top:200px;font-size:40px;text-align:left">chemicals</div></div>`);
      tl.set(".col", { opacity: 0 }, 22.1);
      tl.fromTo("#s4 .cam", focus(540, 400, 1.2), { ...focus(540, 400, 1.0), duration: 0.8, ease: "power2.out" }, 22.1);
      pop("#tube", 22.15);
      tl.fromTo("#tube", { rotation: -8 }, { rotation: 8, duration: 0.2, yoyo: true, repeat: 3, transformOrigin: "50% 80%" }, 22.4);
      tl.fromTo("#test", { scale: 2, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.25, ease: "back.out(3)" }, W(4, "test"));
      tl.to(["#tube", "#test"], { opacity: 0, scale: 0.6, duration: 0.25 }, W(4, "lab") - 0.3);
      pop("#lab", W(4, "lab")); pop("#kit", W(4, "field"));
      tl.fromTo("#dish", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, W(4, "detect"));
      tl.to(".col", { opacity: 1, duration: 0.05, stagger: 0.07 }, W(4, "detect") + 0.2);
      tl.to("#s4 .cam", { ...focus(300, 700, 1.3), duration: 0.6, ease: "power2.inOut" }, W(4, "sign") - 0.3);
      tl.to("#s4 .cam", { ...focus(760, 700, 1.3), duration: 0.6, ease: "power2.inOut" }, W(4, "chemicals") - 0.3);
      tl.fromTo("#chem", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, W(4, "chemicals") - 0.2);
      tl.fromTo("#pad1", { attr: { fill: "#fff" } }, { attr: { fill: BLUE }, duration: 0.4 }, W(4, "nitrates"));
      tl.fromTo("#pad2", { attr: { fill: "#fff" } }, { attr: { fill: MUTED }, duration: 0.4 }, W(4, "arsenic"));
      tl.to("#s4 .cam", { ...focus(540, 560, 1.0), duration: 0.6, ease: "power2.inOut" }, 30.1);

      /* ================= S5 · test over time (30.8 – 34.8) ================= */
      const season = (id, left, icon, ok) =>
        `<div id="${id}" class="abs" style="left:${left}px;top:260px;width:260px;text-align:center"><svg viewBox="0 0 160 160" width="170" height="170">${icon}</svg>
        <div style="margin-top:30px">${tube.replace('width="160" height="400"', 'width="70" height="175"')}</div>
        <div class="label" style="font-size:80px;color:${ok ? BLUE : INK}">${ok ? "✓" : "!"}</div></div>`;
      const iSun = `<g stroke="${INK}" stroke-width="8" stroke-linecap="round"><circle cx="80" cy="80" r="34" fill="#ffd34d"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const r = (a * Math.PI) / 180; return `<line x1="${80 + Math.cos(r) * 48}" y1="${80 + Math.sin(r) * 48}" x2="${80 + Math.cos(r) * 66}" y2="${80 + Math.sin(r) * 66}"/>`; }).join("")}</g>`;
      const iCloud = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M40 100 a26 26 0 0 1 8 -50 a36 36 0 0 1 68 -6 a30 30 0 0 1 24 56 Z"/></g><g stroke="${BLUE}" stroke-width="8" stroke-linecap="round"><line x1="56" y1="118" x2="46" y2="144"/><line x1="86" y1="118" x2="76" y2="144"/><line x1="116" y1="118" x2="106" y2="144"/></g>`;
      const iLeaf = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M30 130 Q20 40 130 30 Q140 130 30 130 Z" fill="${SKY}"/><path d="M30 130 L110 50" fill="none"/></g>`;
      add("s5", `<svg class="abs" style="left:0;top:0" width="1080" height="1080"><line id="tline" x1="80" y1="210" x2="1000" y2="210" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M980 190 L1004 210 L980 230" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/></svg>`);
      add("s5", season("sa", 60, iSun, true) + season("sb", 410, iCloud, false) + season("sc", 760, iLeaf, true));
      tl.fromTo("#s5 .cam", focus(540, 480, 1.15), { ...focus(540, 500, 1.0), duration: 4.0, ease: "none" }, 30.8);
      tl.fromTo("#tline", { attr: { x2: 80 } }, { attr: { x2: 1000 }, duration: 1.0, ease: "power2.out" }, 30.85);
      pop("#sa", W(5, "again")); pop("#sb", W(5, "quality")); pop("#sc", W(5, "seasons") - 0.2);

      /* ================= S6 · teaser ep 4 (34.8 – 39.7) ================= */
      const mIcon = (id, left, icon, word) =>
        `<div id="${id}" class="abs" style="left:${left}px;top:110px;width:250px;text-align:center"><svg viewBox="0 0 160 160" width="170" height="170">${icon}</svg><div class="small">${word}</div></div>`;
      const iPot = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><path d="M20 70 L140 70 L130 140 L30 140 Z"/><path d="M8 70 L152 70"/><path d="M50 50 q-8 -14 0 -28 M80 50 q-8 -14 0 -28 M110 50 q-8 -14 0 -28" stroke="${MUTED}" fill="none"/></g>`;
      const iFilter = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round"><path d="M20 30 L140 30 L100 90 L100 140 L60 140 L60 90 Z"/><path d="M36 54 L124 54" stroke="${BLUE}"/></g>`;
      const iChlor = `<g stroke="${INK}" stroke-width="8" fill="#fff" stroke-linejoin="round" stroke-linecap="round"><rect x="50" y="60" width="60" height="84" rx="10" fill="${SKY}"/><path d="M64 60 L64 40 L96 40 L96 60"/><path d="M70 40 L70 20 L90 20 L90 40"/></g><path d="M130 90 C126 100 120 106 120 112 a10 10 0 0 0 20 0 C140 106 134 100 130 90 Z" fill="${BLUE}" stroke="${INK}" stroke-width="5"/>`;
      const iTabs = `<g stroke="${INK}" stroke-width="8" fill="#fff"><circle cx="60" cy="80" r="36"/><line x1="36" y1="80" x2="84" y2="80"/><circle cx="110" cy="104" r="30"/><line x1="90" y1="104" x2="130" y2="104"/></g>`;
      add("s6", mIcon("m1", 20, iPot, "boiling") + mIcon("m2", 285, iFilter, "filters") + mIcon("m3", 550, iChlor, "chlorine") + mIcon("m4", 815, iTabs, "tablets"));
      add("s6", `<div id="q6" class="abs label" style="left:0;top:420px;width:1080px;font-size:180px;color:${BLUE}">?</div>`);
      add("s6", `<div id="next" class="abs" style="left:90px;top:640px;width:900px;padding:28px 40px;border:8px solid ${INK};border-radius:30px;background:${BLUE};color:#fff;text-align:center">
        <div style="font-family:Cap;font-weight:900;font-size:44px;letter-spacing:0.08em">NEXT · EP. 4 →</div>
        <div style="font-family:Hand;font-size:64px;line-height:1.05;margin-top:6px">What does each method really do?</div></div>`);
      tl.fromTo("#s6 .cam", focus(540, 300, 1.2), { ...focus(540, 500, 1.0), duration: 3.0, ease: "power1.inOut" }, 34.8);
      pop("#m1", W(6, "boiling")); pop("#m2", W(6, "filters")); pop("#m3", W(6, "chlorine")); pop("#m4", W(6, "tablets"));
      pop("#q6", W(6, "what"), { rotation: 10 });
      tl.fromTo("#next", { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, W(6, "each"));

      /* ================= S7 · end card (39.7 – 42.7) ================= */
      add("s7", `<div class="abs" style="left:0;top:60px;width:1080px;text-align:center">
        <img id="logo" src="assets/logo.png" style="width:380px;height:380px" />
        <div id="e1" style="font-family:Cap;font-weight:900;font-size:60px;letter-spacing:0.02em;margin-top:10px">WATER: <span style="color:${BLUE}">WHAT WE DON'T SEE</span></div>
        <div id="e2" style="font-family:Cap;font-weight:800;font-size:40px;color:${MUTED};margin-top:6px">EPISODE 3 · aquacoreglobal.com</div>
        <div id="e3" style="display:inline-block;margin-top:50px;padding:24px 44px;border:7px solid ${INK};border-radius:40px;font-family:Hand;font-size:58px">How do <span style="color:${BLUE}">YOU</span> treat your water? 💬</div>
      </div>`);
      pop("#logo", 39.75);
      tl.fromTo("#e1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, 40.0);
      tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, 40.2);
      pop("#e3", 40.5);
      tl.fromTo("#logo", { scale: 1 }, { scale: 1.06, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 40.7);

      /* ================= captions ================= */
      const KEY = /^(germs|tiny|hundreds|pinhead|clear|cloudy|hide|treatment|eyes|nose|taste|safe|risk|warning|toilets|animals|tanks|pipes|floods|rain|test|lab|kit|coli|faecal|chemicals|nitrates|arsenic|time|seasons|boiling|filters|chlorine|tablets|next)$/i;
      const capsEl = document.getElementById("caps");
      TIMED.forEach((words, li) => {
        let chunk = [], chunks = [];
        words.forEach((x, i) => {
          chunk.push(x);
          const len = chunk.map((c) => c.w).join(" ").length;
          if (/[,.?!:]$/.test(x.w) || chunk.length >= 4 || len > 18 || i === words.length - 1) { chunks.push(chunk); chunk = []; }
        });
        chunks.forEach((c, ci) => {
          const id = `c${li}_${ci}`;
          capsEl.insertAdjacentHTML("beforeend", `<div id="${id}" class="cap">${c.map((x, wi) => `<span id="${id}_${wi}"${KEY.test(x.w.replace(/[^\w]/g, "")) ? ' class="k"' : ""}>${x.w}</span>`).join(" ")}</div>`);
          const cs = c[0].t, ce = ci < chunks.length - 1 ? chunks[ci + 1][0].t : c[c.length - 1].t + c[c.length - 1].d + 0.15;
          tl.fromTo(`#${id}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.08 }, cs);
          tl.set(`#${id}`, { opacity: 0 }, ce);
          c.forEach((x, wi) => tl.fromTo(`#${id}_${wi}`, { scale: 1 }, { scale: 1.12, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, x.t));
        });
      });

      if (document.documentElement.dataset.format === "landscape") {
        tl.fromTo("#stage", { scale: 0.92, x: 0, transformOrigin: "0 0" }, { scale: 0.92, x: 0, duration: 0.01 }, 0);
        tl.to("#stage", { x: 393, duration: 0.5, ease: "power2.inOut" }, 39.7);
      }
      tl.set({}, {}, 42.7);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
